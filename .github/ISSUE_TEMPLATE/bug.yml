name: Something is wrong
description: The tool gave a bad answer, or the page misbehaved.
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where were you using it?
      options:
        - The hosted page (fwsoapy.github.io)
        - A downloaded copy, opened from a file
        - A build from source
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows / Safari on iPhone
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >
        If it is a wrong answer rather than a broken page, "Share link" copies a
        link that carries the exact drop. Paste it here and I can reproduce it
        precisely.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
