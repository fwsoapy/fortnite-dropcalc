name: publish to github pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a push that
# lands mid-deploy still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Tests first. A broken solver must not reach the public page.
      - name: Build and test
        run: npm test

      - name: Stage the site
        run: |
          mkdir -p _site
          # The built file IS the site. One file, no assets, no index of its own.
          cp drop-solver.html _site/index.html
          # Also keep it under its real name so a direct link to it still works
          # and so people can save a copy to run offline.
          cp drop-solver.html _site/drop-solver.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
