name: publish to github pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a push that
# lands mid-deploy still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Tests first. A broken solver must not reach the public page.
      - name: Build and test
        run: npm test

      - name: Stage the site
        run: |
          mkdir -p _site
          # The built file IS the site. One file, no assets, no index of its own.
          cp drop-solver.html _site/index.html
          # Also keep it under its real name so a direct link to it still works
          # and so people can save a copy to run offline.
          cp drop-solver.html _site/drop-solver.html
          touch _site/.nojekyll

      # This needs Pages set to "GitHub Actions" as its source, under
      # Settings > Pages. The workflow token is not allowed to turn that on by
      # itself, so it is a one-time click. With the source set to a branch
      # instead, GitHub runs Jekyll over the repo and serves the README as the
      # home page, which is not the app.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
