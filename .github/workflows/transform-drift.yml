name: map transform still fits

# The one failure mode that produces a confident wrong answer instead of an
# error: Epic re-renders the island at different world bounds, the hardcoded
# MAP_TRANSFORM stops fitting, and every distance the tool reports is quietly
# off. Nothing in the app notices. This checks weekly so a red run turns up in
# your inbox instead of in someone's game.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Project the live POIs through MAP_TRANSFORM
        run: |
          set +e
          node tools/check_transform.js
          code=$?
          set -e
          # 0 fits, 1 drifted, 2 could not check. A dead API or a blocked
          # runner is not a drift, so only 1 fails the run.
          if [ $code -eq 1 ]; then exit 1; fi
          if [ $code -eq 2 ]; then
            echo "::warning::could not check the transform this run, see the log"
          fi
