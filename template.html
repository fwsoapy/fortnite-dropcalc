<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Drop Solver</title>
<style>
/* ===========================================================================
   DESIGN TOKENS - lifted from ui.html (saved shadcn / Tailwind v4 page,
   elements.ai-sdk.dev). Read out of ui_files/*.css and confirmed against that
   page's live computed styles.
   ========================================================================= */
:root{
  --background:#0a0a0a;
  --foreground:#fafafa;
  --card:#171717;
  --popover:#171717;
  --secondary:#262626;
  --muted:#262626;
  --muted-foreground:#a1a1a1;
  --accent:#262626;
  --primary:#006bff;
  --primary-foreground:#ffffff;
  --destructive:#ff6467;
  --warning:#f99c00;
  --success:#00c758;
  --border:rgba(255,255,255,.10);
  --input:rgba(255,255,255,.15);
  --ring:#737373;
  --ghost:rgba(255,255,255,.045);
  --ghost-hover:rgba(255,255,255,.09);

  --radius:.625rem;
  --radius-sm:calc(var(--radius) - 4px);
  --radius-md:calc(var(--radius) - 2px);
  --radius-lg:var(--radius);
  --radius-xl:calc(var(--radius) + 4px);

  --font-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;

  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-pop:0 8px 30px rgba(0,0,0,.55);

  /* Map vectors. Route chevrons are blue rather than the old in-game cyan,
     bright enough to hold up over both the pale desert and the dark ocean.
     Markers stay on the UI blue. */
  --c-route:#4da3ff;
  --c-marker:#006bff;
  --c-jump:#ff6467;
  --c-dive:#ff6467;
  --c-glide:#00c758;
  --c-freefall:#f99c00;
  /* Folder area highlight. Yellow so it cannot be confused with the route
     (cyan), the markers (blue) or any flight phase. */
  --c-area:#ffe14d;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--background);color:var(--foreground);
  font-family:var(--font-sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-text-size-adjust:100%;
}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1}

#stage{position:fixed;inset:0;overflow:hidden;background:var(--background);
  touch-action:none;cursor:grab}
#stage.panning{cursor:grabbing}
#mapCanvas{position:absolute;top:0;left:0;display:block}
#overlay{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
#overlay .hit{pointer-events:auto;cursor:grab}
#overlay .hit:active{cursor:grabbing}
#overlay .swap{pointer-events:auto;cursor:pointer}
#overlay .swap circle:nth-of-type(2){transition:filter .12s}
#overlay .swap:hover circle:nth-of-type(2){filter:brightness(1.25)}


.view-controls{position:fixed;top:16px;right:16px;z-index:20;
  display:flex;flex-direction:column;gap:6px}
.icon-btn{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--input);border-radius:var(--radius-md);
  color:var(--muted-foreground);cursor:pointer;transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--secondary);color:var(--foreground)}
.icon-btn:active{transform:translateY(1px)}
.icon-btn svg{width:16px;height:16px}

#panel{
  position:fixed;left:16px;bottom:16px;z-index:30;width:340px;max-width:calc(100vw - 32px);
  background:color-mix(in srgb,var(--card) 92%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius-xl);
  box-shadow:var(--shadow-pop);
  max-height:calc(100vh - 32px);display:flex;flex-direction:column;
  /* Not overflow:hidden any more: the collapse tab has to sit outside the box. */
  transition:transform .22s cubic-bezier(.4,0,.2,1);
}
.panel-head,.panel-body{min-width:0}
#panel>.panel-head{border-radius:var(--radius-xl) var(--radius-xl) 0 0}
/* #panel dropped overflow:hidden so the tab can sit outside it, so the last
   child has to round its own bottom corners. */
#panel>.panel-body{border-radius:0 0 var(--radius-xl) var(--radius-xl)}

/* COLLAPSE. The panel slides left until only the tab shows, so the map gets the
   whole window back. Transform rather than width so nothing inside reflows, and
   it always clears because it moves by its own width plus its own inset. */
#panel.collapsed{transform:translateX(calc(-100% - 16px))}

#panelToggle{
  position:absolute;left:100%;bottom:0;margin-left:8px;
  width:30px;height:44px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--card) 92%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:var(--shadow-pop);
  color:var(--muted-foreground);cursor:pointer;
  transition:color .12s,background .12s,transform .22s cubic-bezier(.4,0,.2,1);
}
#panelToggle:hover{color:var(--foreground);background:var(--secondary)}
#panelToggle svg{transition:transform .22s cubic-bezier(.4,0,.2,1)}
/* Chevron points left to hide, right to bring it back. */
#panel.collapsed #panelToggle svg{transform:rotate(180deg)}
.panel-head{padding:16px 16px 0}
.panel-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.panel-sub{font-size:12px;color:var(--muted-foreground);margin-top:1px}
.panel-body{padding:16px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
/* The body is the scroller, so children keep their natural height. Without
   this the Calculate button squashes once results make the content tall. */
.panel-body>*{flex-shrink:0}

.field-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.field-label{font-size:13px;font-weight:500}
.field-value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:13px;color:var(--muted-foreground)}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:16px;
  background:transparent;cursor:pointer;
  outline:none;                 /* kills the default focus box */
  -webkit-tap-highlight-color:transparent;
}
input[type=range]:focus{outline:none}
input[type=range]::-moz-focus-outer{border:0}
input[type=range]::-webkit-slider-runnable-track{
  height:6px;border-radius:999px;
  background:linear-gradient(to right,var(--primary) var(--pct,50%),var(--secondary) var(--pct,50%));
}
input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--secondary)}
input[type=range]::-moz-range-progress{height:6px;border-radius:999px;background:var(--primary)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-5px;
  background:var(--foreground);border-radius:50%;border:none;
  box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .15s;
}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;background:var(--foreground);border-radius:50%;border:none;
  box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .15s;
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]:active::-moz-range-thumb{transform:scale(1.15)}
/* Keyboard focus keeps a visible state, but as a soft ring on the thumb
   rather than a rectangle around the control. */
input[type=range]:focus-visible::-webkit-slider-thumb{
  box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 45%,transparent)}
input[type=range]:focus-visible::-moz-range-thumb{
  box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 45%,transparent)}
.range-ends{display:flex;justify-content:space-between;margin-top:4px;
  font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}
.hint{font-size:11px;line-height:1.45;color:var(--muted-foreground);margin-top:5px}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:36px;padding:0 14px;border-radius:var(--radius-md);
  font-size:14px;font-weight:500;transition:background .15s,opacity .15s}
.btn-primary{background:var(--primary);color:var(--primary-foreground);width:100%}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 88%,#fff)}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:var(--ghost);border:1px solid var(--input);color:var(--foreground)}
.btn-ghost:hover{background:var(--ghost-hover)}
.btn-sm{height:30px;padding:0 10px;font-size:12px}

.sep{height:1px;background:var(--border);margin:0 -16px}
.empty{font-size:13px;color:var(--muted-foreground);text-align:center;padding:14px 8px;
  border:1px dashed var(--border);border-radius:var(--radius-lg)}

/* Stale results stay exactly where they are and just dim. No banner, no
   collapse, no layout shift, no recalculation. */
#results{transition:opacity .18s}
#results.stale{opacity:.32}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--secondary);border-radius:var(--radius-md);padding:9px 11px}
.stat.full{grid-column:1/-1}
.stat-k{font-size:11px;color:var(--muted-foreground);margin-bottom:2px}
.stat-v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.stat-v .u{font-size:11px;font-weight:400;color:var(--muted-foreground);margin-left:3px}

.phase-list{display:flex;flex-direction:column;gap:1px;
  background:var(--border);border:1px solid var(--border);
  border-radius:var(--radius-md);overflow:hidden}
.phase{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--card)}
.phase.zero{opacity:.42}
.phase .dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.phase .nm{flex:1;font-size:13px;font-weight:500}
.phase .alt{font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:11px;color:var(--muted-foreground)}
.phase .tm{font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:13px;font-weight:600;min-width:46px;text-align:right}

.section-label{font-size:11px;font-weight:500;color:var(--muted-foreground);margin-bottom:7px}

/* ---------- saved drops ---------- */
.drops-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
.drops-count{font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:11px;color:var(--muted-foreground)}
.drops-empty{font-size:12px;color:var(--muted-foreground);padding:2px 0 4px}

/* FOLDERS. Chevron collapses, the name toggles the map area, x deletes. */
.folder-row{display:flex;align-items:center;gap:4px;
  padding:4px 6px 4px 4px;margin-bottom:4px;
  background:var(--ghost);border:1px solid transparent;
  border-radius:var(--radius-sm);color:var(--muted-foreground);
  transition:background .15s,color .15s,border-color .15s}
.folder-row:hover{background:var(--ghost-hover)}
.folder-chev{width:22px;height:24px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;border-radius:var(--radius-sm);color:inherit;cursor:pointer}
.folder-chev .chev{transition:transform .18s cubic-bezier(.4,0,.2,1);transform:rotate(90deg)}
.folder-chev.shut .chev{transform:rotate(0deg)}
.folder-chev:hover{background:var(--ghost-hover);color:var(--foreground)}
.folder-name{flex:1;min-width:0;display:flex;align-items:center;height:24px;
  padding:0 4px;text-align:left;cursor:pointer;color:inherit;
  border-radius:var(--radius-sm)}
.folder-name:hover{color:var(--foreground)}
.folder-name .nm{flex:1;min-width:0;font-size:12px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:11px;opacity:.75;padding:0 2px}
.folder-row.on{color:var(--c-area);
  background:color-mix(in srgb,var(--c-area) 14%,transparent);
  border-color:color-mix(in srgb,var(--c-area) 45%,transparent)}
/* Children indented under their folder so the grouping reads at a glance. */
.folder-kids{padding-left:10px;
  border-left:1px solid var(--border);margin:0 0 6px 12px}
.loose-zone{min-height:6px;border-radius:var(--radius-sm)}

/* DRAGGING a drop into a folder. */
.drop-item{cursor:grab}
.drop-item.dragging{opacity:.4;cursor:grabbing}
.grip{flex-shrink:0;display:flex;align-items:center;color:var(--muted-foreground);
  opacity:.5;margin-right:1px}
.drop-item:hover .grip{opacity:.9}
.folder-row.drag-over,.folder-kids.drag-over,.loose-zone.drag-over{
  background:color-mix(in srgb,var(--primary) 16%,transparent);
  outline:1px dashed color-mix(in srgb,var(--primary) 70%,transparent);
  outline-offset:-1px}
.drop-item{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 9px;
  background:var(--secondary);border-radius:var(--radius-sm);margin-bottom:4px}
.drop-item .nm{flex:1;min-width:0;font-size:12px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop-item .mini{height:24px;padding:0 9px;font-size:11px;border-radius:var(--radius-sm)}
.drop-x{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;border-radius:var(--radius-sm);
  color:var(--muted-foreground);transition:background .15s,color .15s}
.drop-x:hover{background:color-mix(in srgb,var(--destructive) 18%,transparent);
  color:var(--destructive)}
.save-row{display:flex;gap:6px;margin-top:8px}
.save-row input{flex:1;min-width:0}
.save-row button:disabled,.save-row input:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;line-height:1.5;padding:9px 11px;border-radius:var(--radius-md);
  border:1px solid var(--border);background:var(--secondary);color:var(--muted-foreground)}
.note.warn{border-color:color-mix(in srgb,var(--warning) 35%,transparent);
  background:color-mix(in srgb,var(--warning) 9%,transparent);color:var(--warning)}
.note.err{border-color:color-mix(in srgb,var(--destructive) 35%,transparent);
  background:color-mix(in srgb,var(--destructive) 9%,transparent);color:var(--destructive)}
.note b{color:var(--foreground);font-weight:600}
.note.err b,.note.warn b{color:inherit}

input[type=text]{width:100%;height:32px;padding:0 9px;background:var(--ghost);
  border:1px solid var(--input);border-radius:var(--radius-sm);
  color:var(--foreground);font-family:var(--font-sans);font-size:12px}
/* Scoped to text fields only. A bare input:focus also matched the range slider
   and drew a 3px box right around it. */
input[type=text]:focus{outline:none;border-color:var(--ring);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 30%,transparent)}

/* MODE PICKER, BUILT RATHER THAN NATIVE.

   A <select> renders its popup with the operating system's own colours, which
   here meant a white list inheriting the theme's near-white text: every row
   except the highlighted one was invisible. There is no CSS fix for that, the
   popup is not ours to style, so the list is a real element. */
.dd-btn{width:100%;height:32px;padding:0 9px;display:flex;align-items:center;
  justify-content:space-between;gap:8px;cursor:pointer;
  background:var(--ghost);border:1px solid var(--input);
  border-radius:var(--radius-sm);color:var(--foreground);
  font-family:var(--font-sans);font-size:12px;font-weight:500;text-align:left;
  transition:border-color .12s,background .12s}
.dd-btn:hover{background:var(--ghost-hover)}
.dd-btn[aria-expanded="true"]{border-color:var(--ring)}
.dd-chev{flex-shrink:0;color:var(--muted-foreground);
  transition:transform .18s cubic-bezier(.4,0,.2,1)}
.dd-btn[aria-expanded="true"] .dd-chev{transform:rotate(180deg)}

/* Fixed, not absolute: the panel body scrolls and would otherwise clip it. */
.dd-list{position:fixed;z-index:60;display:none;padding:4px;
  background:var(--popover);border:1px solid var(--border);
  border-radius:var(--radius-md);box-shadow:var(--shadow-pop);
  max-height:60vh;overflow-y:auto}
.dd-list.open{display:block}
.dd-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:7px 9px;border-radius:var(--radius-sm);cursor:pointer;
  font-family:var(--font-sans);font-size:12px;font-weight:500;text-align:left;
  color:var(--foreground);background:transparent}
.dd-opt:hover,.dd-opt.active{background:var(--secondary)}
.dd-opt[aria-selected="true"]{color:var(--c-route)}
.dd-opt[aria-disabled="true"]{color:var(--muted-foreground);cursor:default;opacity:.55}
.dd-opt[aria-disabled="true"]:hover{background:transparent}
.dd-tag{font-size:10px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted-foreground)}
.dd-check{flex-shrink:0;opacity:0}
.dd-opt[aria-selected="true"] .dd-check{opacity:1}


.share-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share-row .btn{height:32px;font-size:12px}

/* SHARED VIEW SHOWS THE ANSWER AND NOTHING ELSE: the stat grid, the descent
   phases and the instruction line. Every control is hidden, because none of
   them mean anything when the markers are locked.

   Hidden by id rather than by position in the panel. Positional selectors like
   .panel-body>div:last-child were used first and are quietly wrong the moment a
   block is added or reordered. */
body.shared #wallBlock,
body.shared #btnCalc,
body.shared #shareRow,
body.shared #shareHint,
body.shared #sepA,
body.shared #sepB,
body.shared #dropsBlock{display:none}
body.shared .panel-sub{color:var(--c-route);font-weight:500}

@media (max-width:640px){
  #panel{left:8px;right:8px;bottom:8px;width:auto;max-height:52vh}
  .view-controls{top:10px;right:10px}
  .zoom-badge{top:10px;left:10px}
  .stat-v{font-size:16px}

  /* The panel is full width here, so sliding it sideways would take the tab off
     screen with it. Collapse down to just the header instead, tab on the right
     of that header, chevron pointing down to close and up to reopen. */
  #panelToggle{left:auto;right:10px;top:10px;bottom:auto;margin:0;
    width:34px;height:30px;box-shadow:none}
  #panelToggle svg{transform:rotate(-90deg)}
  #panel.collapsed{transform:none}
  #panel.collapsed .panel-body{display:none}
  #panel.collapsed #panelToggle svg{transform:rotate(90deg)}
}
</style>
</head>
<body>

<div id="stage">
  <canvas id="mapCanvas"></canvas>
  <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="view-controls">
  <button class="icon-btn" id="btnZoomIn" title="Zoom in" aria-label="Zoom in">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="icon-btn" id="btnZoomOut" title="Zoom out" aria-label="Zoom out">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
  </button>
  <button class="icon-btn" id="btnReset" title="Reset view" aria-label="Reset view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  </button>
</div>

<aside id="panel">
  <button id="panelToggle" aria-label="Hide panel" aria-expanded="true" title="Hide panel">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path d="M15 6 L9 12 L15 18" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div class="panel-head">
    <div class="panel-title">Drop Solver</div>
    <div class="panel-sub">Drag the markers, then calculate</div>
  </div>
  <div class="panel-body">
    <div id="modeBlock">
      <div class="field-row">
        <span class="field-label">Mode</span>
      </div>
      <button class="dd-btn" id="modeBtn" aria-haspopup="listbox" aria-expanded="false">
        <span id="modeBtnText">Battle Royale</span>
        <svg class="dd-chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div id="wallBlock">
      <div class="field-row">
        <span class="field-label">Wall height offset</span>
        <span class="field-value" id="wallValue">0 walls</span>
      </div>
      <input type="range" id="wallSlider" min="-10" max="10" step="1" value="0"
             aria-label="Wall height offset">
      <div class="range-ends"><span>-10</span><span>+10</span></div>
    </div>
    <button class="btn btn-primary" id="btnCalc">Calculate</button>
    <div class="share-row" id="shareRow">
      <button class="btn btn-ghost btn-sm" id="btnShareImg">Share image</button>
      <button class="btn btn-ghost btn-sm" id="btnShareLink">Share link</button>
    </div>
    <div class="hint" id="shareHint" style="display:none"></div>
    <div class="sep" id="sepA"></div>
    <div id="results"></div>
    <div class="sep" id="sepB"></div>
    <div id="dropsBlock">
      <div class="drops-head">
        <span class="section-label" style="margin:0">Saved drops</span>
        <span class="drops-count" id="dropCount">0</span>
      </div>
      <div id="dropList"></div>
      <div class="save-row">
        <input type="text" id="dropName" placeholder="Name this drop" maxlength="22"
               autocomplete="off" spellcheck="false">
        <button class="btn btn-ghost btn-sm" id="btnSaveDrop">Save</button>
      </div>
      <div class="save-row" style="margin-top:8px">
        <input type="text" id="newFolder" placeholder="New folder" maxlength="18"
               autocomplete="off" spellcheck="false">

<!-- Outside the panel on purpose. #panel has a backdrop-filter, which makes it
     a containing block for position:fixed children, so a popup nested inside it
     lands relative to the panel instead of the viewport. -->
<div class="dd-list" id="modeList" role="listbox" aria-label="Game mode"></div>


<script>
'use strict';

/* ======================= THE SOLVER =======================

   The physics is NOT written in this file. `solver.js` is the single source
   for it, and build.js inlines a verbatim copy right here, the same way it
   inlines the two map images. That is why there is no second implementation
   to keep in step any more. There used to be one: the tests could only see
   `solver.js`, and all that stood between the two copies was a check that
   compared the constants, which could not see a logic change at all.

   To change the physics: edit `solver.js`, run `npm test`, run `npm run build`.
   ========================================================================== */
/*__SOLVER_JS__*/

/* ======================= UI-ONLY CONFIG =======================

   Everything the solver has no use for: the map API, what the modes are
   called, what colour each phase is drawn in. It is merged onto the solver's
   CONFIG so the rest of the page still sees a single object. Nothing with a
   metre or a second in it belongs in here.
   ============================================================== */
Object.assign(CONFIG, {
  /* Bus altitude. technik-consulting.eu: "into the bus 830", and "right after
     the jump 810". Fixed, not a slider: the bus flies the same height every
     match, so exposing it only ever let it be set wrong. */
  busAltitude:830,

  /* How close the landing pin has to be to a POI to inherit its elevation. */
  snapRadius:150,
  /* Hard stops at both ends. min 1 = the map exactly fills the frame. */
  /* min 0.8 = you can pull back to 80% of the fit, so there is a margin of
     ocean visible around the whole island. max is unchanged. */
  zoom:{min:0.8, max:12, wheel:1.0022},

  apiUrl:'https://fortnite-api.com/v1/map',
  apiTimeoutMs:8000,

  /* ======================= MODES =======================

     What changes is the ending: modern Battle Royale lets you cut the glider and
     freefall the last stretch, OG does not, so in OG the glider opens at 100 m
     and takes you all the way in.

     Each mode carries its own map and its own transform, because a position is
     only meaningful against the island it was clicked on.

     A mode may also override individual flight speeds through `speeds`, which is
     shallow-merged over CONFIG.modes for that mode only.

     BATTLE ROYALE IS THE BASELINE AND IS NOT TO BE MOVED BY ANOTHER MODE'S
     MEASUREMENT. Its constants were verified in a real race and it is the mode
     that has actually been played against opponents. When OG measured a glider
     sink of 5.0 m/s where CONFIG says 7.0, the fix was to give OG its own number,
     not to edit the shared one: editing the shared one silently moved Battle
     Royale's cut altitude, its max reach and its jump lead at long offsets.
     Anything measured in one mode belongs to that mode until it is measured in
     the other.

     `live` marks the mode fortnite-api.com actually serves. It serves the
     CURRENT Battle Royale map and nothing else: there is no season or playlist
     parameter, /v2/map and /v1/map/og both 404, and the playlists endpoint
     lists the OG modes but carries no map art at all. So Battle Royale refreshes
     itself every season and OG rides on the embedded image, which has to be
     re-cut by hand when an OG season rolls over. Everything that touches the API
     is gated on `live` so an OG session can never be handed Battle Royale
     coordinates or the Battle Royale island.

     The greyed row is a deliberate placeholder, not a stub to fill in on a
     whim: it needs its own map and its own measured transform. */
  modes_ui:[
    {id:'br', label:'Battle Royale', canCut:true,  ready:true, live:true},
    /* GLIDE_OG, AND BOTH ITS NUMBERS ARE NOW MEASURED IN OG.

       vv 5.0: straight down with the glider open the whole way, the 100 m
       auto-deploy window took about 20 s. Battle Royale cannot see this, because
       it cuts after the 2 s floor and freefalls the rest, so 5 and 7 both fit
       its stopwatch.

       vh 15.0: this used to be 16.57, which was not a measurement at all. It was
       Battle Royale's glide RATIO of 3.314 reapplied to the slower sink, and
       that is the same cross-mode guess that already shipped Battle Royale's
       island scale and Battle Royale's sink rate into OG and was wrong both
       times. It was wrong here too, and OG is the one mode where it shows:

         OG cannot cut, so the last 100 m of every descent is a forced glide, and
         the model hands that window autoDeployAltitude * ratio metres of ground
         on every single drop. At 3.314 that is 331 m, which is 100% of the
         ground on a 300 m drop and still 55% of it on a 600 m one. In Battle
         Royale the same window is worth 79 m and the dive does the work, so an
         error in the ratio is invisible there and dominant here.

       That is exactly the shape of the reported miss: landing about 25-30 m
       short of the pin by the SAME amount on every drop, near or far. A constant
       miss is a fixed-altitude phase, and the forced glide is the only one OG
       has. 100 m of window means 0.25-0.30 of ratio, so 3.314 - 0.28 ~ 3.03.

       Shipped at 3.0 flat, the conservative end of that band, for two reasons.
       It is round in the units the game actually stores: the measured sink is
       exactly 500 uu/s and 15.0 m/s is exactly 1500, and Epic ships movement
       values as round unreal units. And the error is not symmetric. Modelling
       LESS reach than the glider really has makes the solver ask for a slightly
       earlier jump, so you arrive over the target with altitude to spare and
       land on it a fraction of a second late. Modelling MORE reach lands you in
       the street. Bias toward the side that still puts you on the roof.

       The ground height is NOT the lever any more, though it was the fix the
       last two times. It is pinned independently: 830 - 32.7 - 100 = 697.3 m of
       freefall is 12.41 s against the 12.5 s measured straight down, so there is
       no room left in it. See OG_TERRAIN_ELEVATION. */
    {id:'og', label:'OG',            canCut:false, ready:true,
     speeds:{GLIDE:{id:'GLIDE', label:'Glide', vh:15.0, vv:5.0, color:'#00c758'}}},
    {id:'reload',   label:'Reload',    ready:false}
  ],
  /* v5: nothing but markers, saved drops and the wall offset is stored now, so
     no physics constant can ever go stale in a browser again. The bump also
     drops the old settings blob rather than carrying it around forever. */
  storeKey:'dropsolver.v5'
});

/* Phase colours belong to the UI, not to the speeds. */
CONFIG.modes.DIVE.color     = '#ff6467';
CONFIG.modes.GLIDE.color    = '#00c758';
CONFIG.modes.FREEFALL.color = '#f99c00';

const EMBEDDED_MAP = '__MAP_DATA_URI__';
const EMBEDDED_MAP_OG = '__OG_MAP_DATA_URI__';
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

/* ======================= WORLD COORDINATES ======================= */
const worldToNorm = (T,wx,wy) => ({nx:T.a*wx+T.b*wy+T.c, ny:T.d*wx+T.e*wy+T.f});
function normToWorld(T,nx,ny){
  const u = nx-T.c, v = ny-T.f;
  return {wx:T.inv.a*u+T.inv.b*v, wy:T.inv.c*u+T.inv.d*v};
}

/* ======================= STATE ======================= */
const S = {
  img:null, imgW:2048, imgH:2048, ambient:null,
  /* Normalized 0..1 image coords, never touched by zoom or pan. */
  markers:{busStart:{x:0.20,y:0.28}, busEnd:{x:0.82,y:0.66}, target:{x:0.50,y:0.50}},
  view:{k:1, x:0, y:0}, base:{w:0,h:0}, pane:{w:0,h:0},
  motion:{vx:0, vy:0}, raf:0,
  pois:[], drops:[], folders:[], elevation:0, wallOffset:0,
  highlight:null, collapsed:[], dragging:null,
  mode:'br', result:null, stale:false, readonly:false, sharedAt:0, shareTimer:0,
  drag:null, pan:null, pinch:null
};

/* WORLD TO IMAGE, MEASURED NOT GUESSED.
   fortnite-api.com publishes POI world coordinates in cm but no map bounds, so
   the transform was recovered from the images themselves: diff the labelled map
   against the blank one to isolate the label ink, merge each label into a blob,
   then match blob centroids to POI world coordinates. All 13 labelled POIs match
   a blob to a mean of 1.9 px, which pins it beyond doubt.

   Result: the 2048 px image spans 3098.6 m, world +x is image right and world
   +y is image DOWN, and the image is NOT centred on the world origin (it sits
   69.2 m east and 11.4 m south of it). Forcing the centre to the origin leaves a
   systematic 46 px error, so the offset is real.

   Stored normalized so it survives any image resolution. If Epic ever re-renders
   the map at different world bounds, this is the one thing here that would need
   re-measuring; the scripts that derived it are in the handoff. */
const MAP_TRANSFORM = {
  a: 3.2272561355e-6, b: 0, c: 0.47766145254,
  d: 0,               e: 3.2272561355e-6, f: 0.49632202277,
  metresAcross: 3098.6,
  /* PROVISIONAL ON THE 42.00 ISLAND, AND HONESTLY SO.

     Every number above was measured against the 41.x island, by matching label
     ink in map_en.png to the POI world coordinates the API publishes. That fit
     was exact and is not in doubt for the island it was made on.

     42.00 is a different island. The FRAMING is confirmed to carry over: the
     41.20 tiles from fortnite.gg stitch to a 2048 square that lays over the
     API's own map.png with the coastline in the same pixels, and 42.00 comes
     out of the same tile pyramid, so the picture is registered correctly.

     What is NOT confirmed is metresAcross. Nothing published anywhere yet
     carries a 42.00 POI in Epic world units: the API is still serving 41.x
     coordinates, and fortnite.gg places its markers in Leaflet CRS.Simple
     space, which is image space with the world scale already divided out. So
     the span is inherited, not measured, and inheriting a span across islands
     is exactly what cost this project 18% on OG.

     Flagged rather than guessed, so the page says so on screen. To clear it,
     do what OG did: stand in the middle of one POI, mark another, and compare
     the metres on the HUD against what the tool reports. One reading settles
     it. If it is out, scale metresAcross by measured/reported and delete this
     flag. tools/og_scale.js is the same fit if more than one reading is taken. */
  provisional: true
};
/* ======================= THE OG MAP =======================

   Image: the OG island as rendered for OG Chapter 1 Season 9 (Neo Tilted, Mega
   Mall, Pressure Plant), 2048x2048, taken from the Fortnite Wiki's per-patch
   island renders. It was checked against the Battle Royale island before being
   embedded, because a promising looking file elsewhere turned out to be the
   current island cropped to 16:9 and mislabelled.

   ONLY THE SCALE MATTERS HERE, and that is worth being clear about. The Battle
   Royale transform has to be exact in its offset too, because it is matched
   against POI world coordinates that arrive from the API. Nothing external is
   ever matched against the OG map: every point on it comes from the user
   clicking, and every number the solver produces is a distance between two of
   those clicks. Translating the whole island by a few metres changes no answer.
   So the origin sits at the image centre and only `metresAcross` carries weight.

   THE SCALE IS MEASURED IN GAME, not carried over and not guessed. It could not
   be recovered from the image the way the Battle Royale one was: that needed a
   labelled render diffed against a blank one plus POI world coordinates to match
   against, and for OG the wiki publishes no labelled twin and no API publishes
   coordinates. Comparing island extents across renders does not settle it
   either, since the wiki's renders carry a decorative ocean gradient that any
   land-versus-water test latches onto instead of the coastline.

   So it came from the game. Standing in the middle of Salty Springs, marking the
   middle of three other POIs and reading the metres off the HUD:

     Tilted          593 m     Paradise Palms  713 m     Sunny Steps  1162 m

   One unknown fitted from three readings by least squares, which leaves two
   spare as a check rather than an assumption: Paradise Palms lands 0.5% out,
   Sunny Steps 0.4%, Tilted 2.4%, and Tilted is the largest of them so its middle
   is the least well defined. tools/og_scale.js holds the POI pixel centres and
   redoes the fit.

   THIS MATTERED. The placeholder was the Battle Royale figure of 3098.6 m, and
   the Chapter 1 island is genuinely about 15% smaller, so every OG distance read
   18% long and the jump call was out by seconds: on a mid-map drop the old
   number said jump at T+10.8s where the measured one says T+8.4s. Carrying one
   island's scale onto another is exactly the kind of quiet guess that has
   already cost this project several rounds. */
const OG_METRES_ACROSS = 2623.9;
const OG_TRANSFORM = {
  a: 1/(OG_METRES_ACROSS*100), b: 0, c: 0.5,
  d: 0, e: 1/(OG_METRES_ACROSS*100), f: 0.5,
  metresAcross: OG_METRES_ACROSS
};

const withInverse = (t) => {
  const det = t.a*t.e - t.b*t.d;
  t.inv = {a: t.e/det, b:-t.b/det, c:-t.d/det, d: t.a/det};
  return t;
};
withInverse(MAP_TRANSFORM);
withInverse(OG_TRANSFORM);

/* LANDING GROUND HEIGHT, AND WHY OG NEEDS ONE AT ALL.

   Battle Royale gets this free: the API ships a z for every POI and the landing
   pin snaps to the nearest one. OG has no such feed, and the first cut simply
   used sea level. That is wrong everywhere, because no POI in Fortnite sits at
   sea level, and in OG it is badly wrong because of how the flight ENDS.

     Battle Royale ends in FREEFALL, ratio 9.0/56.2 = 0.16
     OG            ends in GLIDE,    ratio 15.0/5.0  = 3.00

   Every metre of ground the solver does not know about is a metre the flight
   never gets to spend, and it is spent at the ratio of whatever phase was
   running. So unmodelled ground costs about 0.2 m of reach in Battle Royale and
   3.0 m in OG, nineteen times worse. At the median POI height that is a 53 m
   shortfall in OG and a 3 m one in Battle Royale, which is the difference
   between "fine" and "I land in front of the house".

   MEASURED, and by two independent routes that agree:

     landing 25 m short of the pin against a modelled 17.5 m of ground. Ground
     costs 3.0 m of reach per metre here, so 25/3.0 = 8.3 m unaccounted for,
     putting the real ground at 25.8 m.

     straight down in OG reaching auto-deploy in 12.5 s. That is 702.5 m of
     freefall, so the ground sits at 830 - 100 - 702.5 = 27.5 m. Hand timing to
     a quarter second is worth +/-14 m, so this says 13 to 41 m.

   Two unrelated measurements landing on 25.8 and 27.5 is the good case, so the
   TERRAIN is 25.0 m: the low end, deliberately, because the first of those two
   readings is contaminated. It back-solves ground from a landing that was short,
   and part of that shortfall has since turned out to belong to the glide ratio
   rather than to the ground. The clean reading is the stopwatch one. For
   reference the 32 POIs the live API publishes sit at a median of 17.5 m, range
   -3.6 to 61.2, which is where the first guess came from and which both
   measurements sit comfortably inside.

   THE SECOND READING IS ALSO WHY THIS CONSTANT IS NOW FROZEN. It pins the whole
   altitude budget without going near the glider: 830 - 32.7 - 100 = 697.3 m of
   freefall is 12.41 s against the 12.5 s on the stopwatch. Raising the ground
   again to absorb a shortfall, which is what happened the last two times, would
   now have to argue with that. So a residual miss belongs to the glide ratio
   instead, and that is where the most recent one went: see GLIDE_OG.

   PLUS THE ROOF, which is the part that kept it short after the terrain was
   right. You do not aim at the dirt beside a building, you aim at the building,
   and the flight ends on the roof: a real surface, a real height, and one the
   solver was ignoring. A Fortnite house is two walls tall, 2 * 3.84 = 7.68 m,
   and in OG every metre of that is 3.0 m of reach. So landing on a roof rather
   than beside it costs 23 m, which is very close to the shortfall that was still
   there after the terrain was measured.

     terrain 25.0 + roof 7.68 = 32.68 m of landing surface

   That is why this is a LANDING SURFACE height and not a terrain height. It is
   the height the flight actually stops at.

   One constant still cannot be right everywhere: ground varies over a range
   worth more than 190 m of OG reach, and roofs vary from a shed to Neo Tilted's
   towers. The wall offset stays the per-drop correction and is worth 11.5 m of
   OG reach per wall, which is exactly one storey. Aiming at open ground instead
   of a building is -2 walls. */
const OG_TERRAIN_ELEVATION = 32.7;

/* The map, the transform and the ground a mode flies over. Keep these together:
   handing a mode one island's picture and another island's scale is silently
   wrong in a way no test on the solver alone would catch. */
const MAPS = {
  br: {image:EMBEDDED_MAP,    transform:MAP_TRANSFORM, elevation:null},
  og: {image:EMBEDDED_MAP_OG, transform:OG_TRANSFORM,  elevation:OG_TERRAIN_ELEVATION}
};
const mapFor = (id) => MAPS[id] || MAPS.br;

S.transform = mapFor(S.mode).transform;

const $ = (id) => document.getElementById(id);
const stage = $('stage'), canvas = $('mapCanvas'), ctx = canvas.getContext('2d'), svg = $('overlay');
const SVGNS = 'http://www.w3.org/2000/svg';

/* ======================= PERSISTENCE =======================

   ONLY GENUINE USER INPUT IS STORED: where the markers are, the saved drops,
   and the wall offset. Every physics constant is read straight from CONFIG on
   every load and is never written to localStorage at all.

   That is deliberate, and it is the fix for a bug that shipped three times.
   When constants were persisted, a value written by an older build outlived the
   default it came from: allowEarlyDeploy stuck at false and capped reach, then
   minGlideTime stuck at 1.5 and the panel kept saying "hold 1.5s" after every
   source file said 2.0. With nothing tunable there is nothing to go stale, so
   retuning a constant now reaches everyone on the next refresh. Keep it that
   way: do not add a settings object back. */
function save(){
  try{
    localStorage.setItem(CONFIG.storeKey, JSON.stringify({
      markers:S.markers, drops:S.drops, folders:S.folders,
      wallOffset:S.wallOffset, mode:S.mode}));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(CONFIG.storeKey); if (!raw) return;
    const o = JSON.parse(raw);
    const pt = (p) => p && isFinite(p.x) && isFinite(p.y);
    if (o.markers && pt(o.markers.busStart) && pt(o.markers.busEnd) && pt(o.markers.target))
      S.markers = {busStart:{x:o.markers.busStart.x, y:o.markers.busStart.y},
                   busEnd:{x:o.markers.busEnd.x, y:o.markers.busEnd.y},
                   target:{x:o.markers.target.x, y:o.markers.target.y}};
    /* No cap: saved drops are unlimited. Anything that is not a usable drop is
       dropped rather than trusted, since this comes back from storage. */
    if (Array.isArray(o.drops)) S.drops = o.drops.filter(d =>
      d && typeof d.name === 'string' && pt(d.busStart) && pt(d.busEnd) && pt(d.target));
    /* A drop tagged with a mode that no longer exists would be listed nowhere
       and look deleted, so anything unrecognised falls back to Battle Royale. */
    for (const d of S.drops)
      if (!CONFIG.modes_ui.some(m => m.id === d.mode && m.ready)) d.mode = 'br';
    if (Array.isArray(o.folders))
      S.folders = o.folders.filter(f => typeof f === 'string' && f.trim())
                           .map(f => f.trim());
    /* Any folder a drop refers to must exist, otherwise its drops would be
       filed under a folder with no row and become unreachable. */
    for (const d of S.drops){
      const f = folderOf(d);
      if (f && !S.folders.includes(f)) S.folders.push(f);
    }
    if (typeof o.mode === 'string' && CONFIG.modes_ui.some(m => m.id === o.mode && m.ready))
      S.mode = o.mode;
    if (isFinite(o.wallOffset))
      S.wallOffset = clamp(Math.round(o.wallOffset), -CONFIG.wallRange, CONFIG.wallRange);
  }catch(e){}
}

/* ======================= COORDINATES ======================= */
const toScreen = (n) => ({x:n.x*S.base.w*S.view.k + S.view.x,
                          y:n.y*S.base.h*S.view.k + S.view.y});
const toNorm = (sx,sy) => ({x:(sx-S.view.x)/(S.base.w*S.view.k),
                            y:(sy-S.view.y)/(S.base.h*S.view.k)});
function toWorld(n){
  if (S.transform){ const w = normToWorld(S.transform, n.x, n.y);
    return {x:w.wx/100, y:w.wy/100}; }
  const a = MAP_TRANSFORM.metresAcross;
  return {x:n.x*a, y:n.y*a*(S.imgH/S.imgW)};
}
function fromWorld(w){
  if (S.transform){ const q = worldToNorm(S.transform, w.x*100, w.y*100);
    return {x:q.nx, y:q.ny}; }
  const a = MAP_TRANSFORM.metresAcross;
  return {x:w.x/a, y:w.y/(a*(S.imgH/S.imgW))};
}

/* ======================= VIEW =======================
   Zoom and pan modelled on the Leaflet setup the reference repo uses
   (zoomSnap 0.25, smooth wheel, drag inertia, bounded with viscosity):
   continuous wheel zoom anchored on the cursor, drag with momentum, and a
   rubber band at both the pan edges and the zoom limits that springs back on
   release rather than hard stopping.
   ==================================================== */
function layout(){
  const W = stage.clientWidth, H = stage.clientHeight;
  S.pane = {w:W, h:H};
  /* Full device pixel ratio, capped only to keep the buffer sane on very high
     DPR phones. This is the single biggest win for map sharpness. */
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const ar = S.imgW/S.imgH;
  let w = W, h = W/ar;
  if (h > H){ h = H; w = H*ar; }
  const had = S.base.w > 0;
  const prev = had ? toNorm(W/2, H/2) : null;
  S.base = {w, h};
  if (!had) resetView();
  else {
    const p = toScreen(prev);
    S.view.x += W/2 - p.x; S.view.y += H/2 - p.y;
    /* Resizing changes the cover ratio, so a zoom that was legal before can now
       be below the floor. Pull it back up about the centre before clamping. */
    const mk = minZoom();
    if (S.view.k < mk){
      const c = {x:W/2, y:H/2}, r = mk/S.view.k;
      S.view.x = c.x - (c.x - S.view.x)*r;
      S.view.y = c.y - (c.y - S.view.y)*r;
      S.view.k = mk;
    }
    hardClamp();
  }
}
/* MINIMUM ZOOM SITS BELOW THE FIT, so you can pull back PAST the island edge and
   see a margin of ocean around the whole map. k = 1 is exactly the fit, so
   CONFIG.zoom.min below 1 is that margin: 0.8 leaves a quarter of a screen of
   slack around the island. The ceiling is untouched, so zoom-in reach is
   unchanged. */
function minZoom(){ return CONFIG.zoom.min; }
function resetView(){
  S.view.k = minZoom();
  const b = bounds();
  S.view.x = (S.pane.w - S.base.w*S.view.k)/2;
  S.view.y = (S.pane.h - S.base.h*S.view.k)/2;
}
/* Allowed pan range at the current zoom. When the scaled map is smaller than
   the pane on an axis it is pinned centred there. */
function bounds(){
  const w = S.base.w*S.view.k, h = S.base.h*S.view.k;
  const cx = (S.pane.w - w)/2, cy = (S.pane.h - h)/2;
  return {
    minX: w <= S.pane.w ? cx : S.pane.w - w, maxX: w <= S.pane.w ? cx : 0,
    minY: h <= S.pane.h ? cy : S.pane.h - h, maxY: h <= S.pane.h ? cy : 0
  };
}
function hardClamp(){
  const b = bounds();
  S.view.x = clamp(S.view.x, b.minX, b.maxX);
  S.view.y = clamp(S.view.y, b.minY, b.maxY);
}
/* Hard limits at both ends, no rubber band. Zoom stops dead at the bounds and
   the map never pulls its edges inside the frame, the way the Leaflet setup in
   the reference repo behaves with maxBounds at full viscosity. */
function zoomAt(cx, cy, factor){
  const k0 = S.view.k;
  const k1 = clamp(k0*factor, minZoom(), CONFIG.zoom.max);
  if (Math.abs(k1-k0) < 1e-9) return;
  S.view.x = cx - (cx - S.view.x)*(k1/k0);
  S.view.y = cy - (cy - S.view.y)*(k1/k0);
  S.view.k = k1;
  hardClamp(); render();
}
/* Drag momentum only. Velocity dies the moment the map hits an edge, so the
   pan glides to a stop instead of bouncing. */
function settle(){
  cancelAnimationFrame(S.raf);
  const step = () => {
    if (Math.abs(S.motion.vx) < 0.06 && Math.abs(S.motion.vy) < 0.06){
      S.motion.vx = 0; S.motion.vy = 0; hardClamp(); render(); return;
    }
    const b = bounds();
    const nx = S.view.x + S.motion.vx, ny = S.view.y + S.motion.vy;
    if (nx < b.minX || nx > b.maxX) S.motion.vx = 0;
    if (ny < b.minY || ny > b.maxY) S.motion.vy = 0;
    S.view.x = clamp(nx, b.minX, b.maxX);
    S.view.y = clamp(ny, b.minY, b.maxY);
    S.motion.vx *= 0.92; S.motion.vy *= 0.92;
    render();
    S.raf = requestAnimationFrame(step);
  };
  S.raf = requestAnimationFrame(step);
}

/* ======================= RENDER ======================= */
function render(){ drawMap(); drawOverlay(); }

/* Ambient wash so the letterbox area is not flat black. A 32px thumbnail of
   the map scaled up with smoothing gives a soft blur of the map's own colours
   for almost no cost, then a radial scrim keeps it behind the map. */
function makeAmbient(img){
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, 32, 32);
  S.ambient = c;
}
function drawAmbient(){
  const {w:W, h:H} = S.pane;
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0,0,W,H);
  if (!S.ambient) return;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  const s = Math.max(W,H)*1.45;
  ctx.drawImage(S.ambient, (W-s)/2, (H-s)/2, s, s);
  ctx.restore();
  const g = ctx.createRadialGradient(W/2,H/2,0, W/2,H/2, Math.max(W,H)*0.72);
  g.addColorStop(0,'rgba(10,10,10,.42)');
  g.addColorStop(1,'rgba(10,10,10,.90)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}
function drawMap(){
  const {w:W, h:H} = S.pane;
  ctx.clearRect(0,0,W,H);
  drawAmbient();
  if (!S.img) return;
  const dw = S.base.w*S.view.k, dh = S.base.h*S.view.k;
  /* Draw only the visible source sub-rectangle at its destination size, so the
     browser resamples just what is on screen instead of the whole 2048px
     bitmap every frame. Sharper when zoomed and cheaper. */
  const dx0 = Math.max(0, S.view.x), dy0 = Math.max(0, S.view.y);
  const dx1 = Math.min(W, S.view.x + dw), dy1 = Math.min(H, S.view.y + dh);
  if (dx1 <= dx0 || dy1 <= dy0) return;
  const sx = (dx0 - S.view.x)/dw*S.imgW, sy = (dy0 - S.view.y)/dh*S.imgH;
  const sw = (dx1 - dx0)/dw*S.imgW,     sh = (dy1 - dy0)/dh*S.imgH;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(S.img, sx, sy, sw, sh, dx0, dy0, dx1-dx0, dy1-dy0);
}

const el = (tag, attrs) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};

/* Convex hull, Andrew's monotone chain. Returns the points in order. */
function hull(pts){
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a,b) => a.x - b.x || a.y - b.y);
  const cross = (o,a,b) => (a.x-o.x)*(b.y-o.y) - (a.y-o.y)*(b.x-o.x);
  const half = (src) => {
    const out = [];
    for (const q of src){
      while (out.length >= 2 && cross(out[out.length-2], out[out.length-1], q) <= 0) out.pop();
      out.push(q);
    }
    out.pop();
    return out;
  };
  return half(p).concat(half(p.reverse()));
}

/* Push a convex polygon outward by pad, keeping the sides STRAIGHT.

   Each edge slides out along its own outward normal. Consecutive offset edges
   are then intersected to give the new corner, which is a true mitered offset.

   THE MITER LIMIT IS THE WHOLE TRICK. A miter sits pad/sin(angle/2) from the
   original corner, so a sharp corner throws it a very long way out: a triangle
   of drops was pushing one corner 96 px for a 34 px pad, nearly three times the
   spacing, which made the shape a huge spiky triangle nowhere near the pins.
   Past the limit the corner is BEVELLED instead, emitting the two offset edge
   endpoints so the corner is simply cut off. Every part of the outline then
   stays exactly pad away from the hull, sides stay straight, and nothing is
   rounded.

   An even earlier version faked the whole thing with a very thick round-joined
   stroke, which is a Minkowski sum with a disc. That rounded every corner, and
   because the stroke sits on top of the fill it doubled up and showed two
   different opacities. This returns real geometry, so the shape is drawn as ONE
   path with ONE fill opacity. */
const MITER_LIMIT = 1.4;          // bevel anything sharper than about 90 degrees
function expandPoly(h, pad){
  const n = h.length;
  /* Work in a known orientation so "outward" is unambiguous. */
  let area = 0;
  for (let i = 0; i < n; i++){
    const a = h[i], b = h[(i+1)%n];
    area += a.x*b.y - b.x*a.y;
  }
  const p = area < 0 ? h.slice().reverse() : h.slice();

  /* Offset every edge along its outward normal, keeping both endpoints. */
  const seg = [];
  for (let i = 0; i < n; i++){
    const a = p[i], b = p[(i+1)%n];
    const dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy) || 1;
    const nx = dy/L, ny = -dx/L;                       // outward for this winding
    seg.push({ax:a.x+nx*pad, ay:a.y+ny*pad, bx:b.x+nx*pad, by:b.y+ny*pad, dx, dy});
  }
  const out = [];
  for (let i = 0; i < n; i++){
    const u = seg[(i-1+n)%n], v = seg[i], c = p[i];
    const den = u.dx*v.dy - u.dy*v.dx;
    if (Math.abs(den) > 1e-9){
      const t = ((v.ax-u.ax)*v.dy - (v.ay-u.ay)*v.dx) / den;
      const q = {x:u.ax + u.dx*t, y:u.ay + u.dy*t};
      if (Math.hypot(q.x-c.x, q.y-c.y) <= pad*MITER_LIMIT){ out.push(q); continue; }
    }
    /* Too sharp, or the edges are parallel: cut the corner. */
    out.push({x:u.bx, y:u.by}, {x:v.ax, y:v.ay});
  }
  return out;
}

/* The outline for a set of points, pad away from all of them.

   A convex hull needs real area before it can be offset. One drop has none, two
   have none, and three nearly in a line have almost none, which made the winding
   test pick the wrong side and pushed the outline the WRONG WAY, leaving the
   pins outside their own highlight. All three are the same case: the points lie
   on a segment, and the answer is a rectangle around that segment, oriented
   along it rather than axis aligned so the margin stays exactly pad the whole
   way round. A single drop falls out of the same code as a square. */
function areaPolygon(pts, pad){
  let a = pts[0], b = pts[0], span = -1;
  for (const p of pts) for (const q of pts){
    const d = Math.hypot(p.x-q.x, p.y-q.y);
    if (d > span){ span = d; a = p; b = q; }
  }
  let ux = 1, uy = 0, maxPerp = 0;
  if (span > 1e-6){
    ux = (b.x-a.x)/span; uy = (b.y-a.y)/span;
    for (const p of pts)
      maxPerp = Math.max(maxPerp, Math.abs((p.x-a.x)*(-uy) + (p.y-a.y)*ux));
  }
  if (span > 1e-6 && maxPerp >= 2) return expandPoly(hull(pts), pad);

  const nx = -uy, ny = ux;
  const A = {x:a.x-ux*pad, y:a.y-uy*pad}, B = {x:b.x+ux*pad, y:b.y+uy*pad};
  return [{x:A.x+nx*pad, y:A.y+ny*pad}, {x:B.x+nx*pad, y:B.y+ny*pad},
          {x:B.x-nx*pad, y:B.y-ny*pad}, {x:A.x-nx*pad, y:A.y-ny*pad}];
}

/* FOLDER AREA HIGHLIGHT.

   The region covering every drop in the open folder: the convex hull of the
   landing pins, pushed outward so the pins sit inside the shape rather than on
   its edge. Drawn as a single path, one flat fill opacity plus a crisp 2 px
   border, with straight sides and sharp corners. */
const HULL_PAD = 34;
function drawFolderArea(){
  if (!S.highlight) return;
  const pts = S.drops.filter(d => folderOf(d) === S.highlight && d.target
                                  && modeOf(d) === S.mode)
                     .map(d => toScreen(d.target));
  if (!pts.length) return;

  const poly = areaPolygon(pts, HULL_PAD);
  const d = 'M' + poly.map(p => p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' L') + ' Z';
  svg.appendChild(el('path', {
    d, fill:'var(--c-area)', 'fill-opacity':0.34,
    stroke:'var(--c-area)', 'stroke-width':2, 'stroke-opacity':0.9,
    'stroke-linejoin':'miter', 'pointer-events':'none'
  }));

  /* A small dot on each drop in the folder, so you can see what it covers. */
  for (const p of pts){
    svg.appendChild(el('circle', {cx:p.x.toFixed(1), cy:p.y.toFixed(1), r:4,
      fill:'var(--c-area)', stroke:'#000', 'stroke-opacity':.35, 'stroke-width':1,
      'pointer-events':'none'}));
  }
}

function drawOverlay(){
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const A = toScreen(S.markers.busStart), B = toScreen(S.markers.busEnd),
        T = toScreen(S.markers.target);
  /* A stale answer is never drawn on the map. */
  const r = (!S.stale && S.result && S.result.ok) ? S.result : null;

  drawFolderArea();            // underneath everything else
  drawBusRoute(A, B);
  if (r) drawFlight(r, T);
  drawBusMarker(A, 'Start', 'busStart');
  drawBusMarker(B, 'End', 'busEnd');
  if (r) drawJump(toScreen(fromWorld(r.jumpPos)));
  drawPin(T);
}

/* The thicker, closer chevron: 5 px stroke on 8 px arms, spaced 13 px apart at
   every zoom. This is the version that was tried with a dark edge behind it;
   the edge was rejected, the geometry was not. Spacing is in screen pixels, so
   zooming in lays down more of them and the band keeps its density. */
const CHEVRON = `M${-ROUTE_DEPTH} ${-ROUTE_HALF} L0 0 L${-ROUTE_DEPTH} ${ROUTE_HALF}`;

function drawBusRoute(A, B){
  const dx = B.x-A.x, dy = B.y-A.y, L = Math.hypot(dx,dy);
  if (L < 2) return;
  const ux = dx/L, uy = dy/L, ang = Math.atan2(dy,dx)*180/Math.PI;

  const from = Math.min(ROUTE_INSET, L/2), to = Math.max(L - ROUTE_INSET, L/2);
  const span = to - from;
  /* Spacing is a fixed number of SCREEN pixels, so zooming in lays down more
     chevrons and keeps the band looking the same density at every zoom. */
  const n = Math.min(ROUTE_MAX, Math.max(ROUTE_MIN, Math.round(span/ROUTE_STEP)));

      'stroke-width':ROUTE_W, 'stroke-linecap':'round', 'stroke-linejoin':'round',
      opacity:.9});

       for it or chevrons show through the middle of the ring. */
    const gap = SWAP_R + 6, half = L/2;
    for (let i = 0; i < n; i++){
      const s = from + (n === 1 ? span/2 : (i/(n-1))*span);
      if (Math.abs(s - half) < gap) continue;
      g.appendChild(el('path', {d:CHEVRON,
        transform:`translate(${(A.x+ux*s).toFixed(2)} ${(A.y+uy*s).toFixed(2)}) `
                + `rotate(${ang.toFixed(2)})`}));
    }
    svg.appendChild(g);
  }

  if (S.readonly) return;                 // nothing to change in a shared view
  /* Swap control at the midpoint. */
  const mx = A.x + ux*(L/2), my = A.y + uy*(L/2);
  const s = el('g', {class:'swap', 'data-swap':'1',
    transform:`translate(${mx.toFixed(2)} ${my.toFixed(2)})`});

  s.appendChild(el('circle', {cx:0, cy:0, r:SWAP_R + 7, fill:'transparent'}));

     bus_reverse.png, then filled blue and given a white outline. There is no
     disc behind it: the shape itself is the control. non-scaling-stroke keeps
     the outline 2 px on screen despite the scale transform. */
  s.appendChild(el('path', {d:SWAP_GLYPH,
    fill:'var(--c-marker)', 'fill-rule':'nonzero',
    stroke:'#ffffff', 'stroke-width':1.5, 'stroke-linejoin':'round',
    'vector-effect':'non-scaling-stroke',
    transform:'scale(0.74) translate(-32 -32)'}));
  svg.appendChild(s);
}

/* Bus endpoints: plain blue circles with the label underneath. */
function drawBusMarker(p, label, key){
  /* No drag handle in a shared view. The transform is needed either way, so it
     is merged in rather than living inside the branch. */
  const g = el('g', Object.assign({transform:`translate(${p.x} ${p.y})`},
    S.readonly ? {} : {class:'hit', 'data-marker':key}));
  g.appendChild(el('circle', {cx:0, cy:0, r:19, fill:'transparent'}));
  /* Deliberately larger than a chevron (5.5 half height) so the ends of the
     line read as ends, not as another arrow in the band. */
  g.appendChild(el('circle', {cx:0, cy:0, r:11, fill:'var(--c-marker)',
    stroke:'#ffffff', 'stroke-width':2.5}));
  const t = el('text', {x:0, y:26, 'text-anchor':'middle',
    'font-family':'var(--font-sans)', 'font-size':11, 'font-weight':600,
    'letter-spacing':'.03em',
    fill:'#cfefff', stroke:'rgba(4,10,18,.85)', 'stroke-width':3.5,
    'stroke-linejoin':'round', 'paint-order':'stroke fill'});

/* Landing pin. Dark outline and a dark core instead of the previous white ring

/* Landing pin: flat blue, no outline, and the hole in the head is genuinely
   transparent rather than filled dark. The teardrop and the inner circle are
   one compound path with fill-rule evenodd, so the circle punches through and
   the map shows underneath. */

  const g = el('g', Object.assign({transform:`translate(${p.x} ${p.y})`},
    S.readonly ? {} : {class:'hit', 'data-marker':'target'}));
  g.appendChild(el('rect', {x:-14, y:-36, width:28, height:40, fill:'transparent'}));
  g.appendChild(el('path', {
    d:'M0 0 C0 0 10 -12.5 10 -20 A10 10 0 1 0 -10 -20 C-10 -12.5 0 0 0 0 Z'
      + ' M0 -24.2 A4.2 4.2 0 1 1 0 -15.8 A4.2 4.2 0 1 1 0 -24.2 Z',
    'fill-rule':'evenodd', fill:'var(--c-marker)'}));
