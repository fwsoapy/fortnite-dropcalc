}

function drawJump(p){
  svg.appendChild(el('circle', {cx:p.x, cy:p.y, r:9, fill:'var(--c-jump)',
    stroke:'#ffffff', 'stroke-width':2.5}));
}

function drawFlight(r, T){
  const wExit = r.exitPos, wT = toWorld(S.markers.target), total = r.airDistance;
  const ux = total > EPS ? (wT.x-wExit.x)/total : 0;
  const uy = total > EPS ? (wT.y-wExit.y)/total : 0;
  let acc = 0;
  const segs = [];
  for (const ph of r.air.phases){
    const seg = Math.min(ph.distance, Math.max(0, total-acc));
    const a = toScreen(fromWorld({x:wExit.x+ux*acc, y:wExit.y+uy*acc}));
    acc += seg;
    const b = toScreen(fromWorld({x:wExit.x+ux*acc, y:wExit.y+uy*acc}));
    if (seg > 1e-6) segs.push({a, b, ph});
  }
  /* Weights and dash patterns follow the reference repo's flight polylines:
     weight 3 at 0.8 opacity, the powered legs dashed and the glide solid. */
  const DASH = {GLIDE_EARLY:null, DIVE:'10 8', GLIDE:null, FREEFALL:'8 6'};
  for (const s of segs){
    const a = {x1:s.a.x, y1:s.a.y, x2:s.b.x, y2:s.b.y, stroke:s.ph.color,
      'stroke-width':3, 'stroke-linecap':'round', opacity:.9};
    if (DASH[s.ph.mode]) a['stroke-dasharray'] = DASH[s.ph.mode];
    svg.appendChild(el('line', a));
  }
  /* Phase transition markers, same radius as the jump dot. */
  for (let i = 0; i < segs.length-1; i++)
    svg.appendChild(el('circle', {cx:segs[i].b.x, cy:segs[i].b.y, r:7.5,
      fill:segs[i+1].ph.color, stroke:'#ffffff', 'stroke-width':2}));

  /* Glider markers. An instant pull gets TWO: where you pull off the bus, and
     where the glider comes back out on its own at 100 m. Without the second
     one the four-leg profile never said when the auto-deploy happens. */
  const mark = (pt, text) => {
    svg.appendChild(el('circle', {cx:pt.x, cy:pt.y, r:7.5,
      fill:'var(--c-glide)', stroke:'#ffffff', 'stroke-width':2.5}));
    const t = el('text', {x:pt.x, y:pt.y - 13, 'text-anchor':'middle',
      'font-family':'var(--font-sans)', 'font-size':11, 'font-weight':600,
      fill:'#d9ffe9', stroke:'rgba(4,10,18,.9)', 'stroke-width':3.5,
      'stroke-linejoin':'round', 'paint-order':'stroke fill'});
    t.textContent = text;
    svg.appendChild(t);
  };
  /* The auto-deploy is always the start of the GLIDE leg. */
  const autoSeg = segs.find(s => s.ph.mode === 'GLIDE');
  if (r.air.earlyDeploy && segs.length) mark(segs[0].a, 'Pull insta');
  if (autoSeg) mark(autoSeg.a, 'Auto deploy');
}

/* ======================= INTERACTION ======================= */
const evPos = (e) => { const r = stage.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top}; };

svg.addEventListener('pointerdown', (e) => {
  if (S.readonly) return;
  /* The swap control is checked first: it sits on the route line, so a marker
     test would never reach it, and acting on pointerdown keeps it from being
     read as the start of a pan. */
  if (e.target.closest('[data-swap]')){
    e.stopPropagation();
    const a = S.markers.busStart;
    S.markers.busStart = S.markers.busEnd;
    S.markers.busEnd = a;
    invalidate(); drawOverlay(); save();
    return;
  }
  const g = e.target.closest('[data-marker]');
  if (!g) return;
  e.stopPropagation();
  S.drag = g.getAttribute('data-marker');
  try{ svg.setPointerCapture(e.pointerId); }catch(err){}
});
svg.addEventListener('pointermove', (e) => {
  if (!S.drag) return;
  e.stopPropagation();
  const p = evPos(e), n = toNorm(p.x, p.y);
  S.markers[S.drag] = {x:clamp(n.x,0,1), y:clamp(n.y,0,1)};
  if (S.drag === 'target') applySnap();
  invalidate(); drawOverlay();
});
const endMarkerDrag = () => { if (S.drag){ S.drag = null; save(); } };
svg.addEventListener('pointerup', endMarkerDrag);
svg.addEventListener('pointercancel', endMarkerDrag);

const pointers = new Map();
stage.addEventListener('pointerdown', (e) => {
  cancelAnimationFrame(S.raf);
  S.motion.vx = 0; S.motion.vy = 0;
  pointers.set(e.pointerId, evPos(e));
  if (pointers.size === 1){
    const p = evPos(e);
    S.pan = {x:p.x, y:p.y, vx:S.view.x, vy:S.view.y, lx:p.x, ly:p.y, moved:false};
    stage.classList.add('panning');
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  } else if (pointers.size === 2){
    const [p1,p2] = [...pointers.values()];
    S.pinch = {d:Math.hypot(p2.x-p1.x, p2.y-p1.y), k:S.view.k,
      cx:(p1.x+p2.x)/2, cy:(p1.y+p2.y)/2, vx:S.view.x, vy:S.view.y};
    S.pan = null;
  }
});
stage.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, evPos(e));
  if (S.pinch && pointers.size >= 2){
    const [p1,p2] = [...pointers.values()];
    const d = Math.hypot(p2.x-p1.x, p2.y-p1.y);
    if (S.pinch.d > 4){
      const k1 = clamp(S.pinch.k*(d/S.pinch.d), minZoom(), CONFIG.zoom.max);
      S.view.x = S.pinch.cx - (S.pinch.cx - S.pinch.vx)*(k1/S.pinch.k);
      S.view.y = S.pinch.cy - (S.pinch.cy - S.pinch.vy)*(k1/S.pinch.k);
      S.view.k = k1;
      hardClamp(); render();
    }
    return;
  }
  if (S.pan){
    const p = evPos(e);
    const b = bounds();
    S.view.x = clamp(S.pan.vx + (p.x - S.pan.x), b.minX, b.maxX);
    S.view.y = clamp(S.pan.vy + (p.y - S.pan.y), b.minY, b.maxY);
    S.motion.vx = p.x - S.pan.lx; S.motion.vy = p.y - S.pan.ly;
    S.pan.lx = p.x; S.pan.ly = p.y;
    if (Math.hypot(p.x-S.pan.x, p.y-S.pan.y) > 3) S.pan.moved = true;
    render();
  }
});
function endStagePointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2 && S.pinch){ S.pinch = null; settle(); }
  if (pointers.size === 0){
    if (S.pan && !S.pan.moved){
      const p = evPos(e), n = toNorm(p.x, p.y);
      if (n.x >= 0 && n.x <= 1 && n.y >= 0 && n.y <= 1){
        S.markers.target = n; applySnap(); invalidate(); drawOverlay(); save();
      }
      S.motion.vx = 0; S.motion.vy = 0;
    }
    S.pan = null; stage.classList.remove('panning');
    settle();
  }
}
stage.addEventListener('pointerup', endStagePointer);
stage.addEventListener('pointercancel', endStagePointer);
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const p = evPos(e);
  zoomAt(p.x, p.y, Math.pow(CONFIG.zoom.wheel, -e.deltaY));
}, {passive:false});

/* One press is half a zoom level, matching the reference's Leaflet zoomDelta of
   0.5, so the buttons step the same amount that one does. */
const ZOOM_STEP = Math.SQRT2;
$('btnZoomIn').onclick  = () => zoomAt(S.pane.w/2, S.pane.h/2, ZOOM_STEP);
$('btnZoomOut').onclick = () => zoomAt(S.pane.w/2, S.pane.h/2, 1/ZOOM_STEP);

/* ---- collapse the panel ---- */
$('panelToggle').addEventListener('click', () => {
  const p = $('panel'), open = !p.classList.toggle('collapsed');
  const b = $('panelToggle');
  b.setAttribute('aria-expanded', String(open));
  b.setAttribute('aria-label', open ? 'Hide panel' : 'Show panel');
  b.title = open ? 'Hide panel' : 'Show panel';
});
$('btnReset').onclick   = () => { cancelAnimationFrame(S.raf);
  S.motion.vx = S.motion.vy = 0; resetView(); render(); };

/* ======================= SNAP ======================= */
function applySnap(){
  /* POI coordinates are Battle Royale's world, and only Battle Royale's. On any
     other island the nearest one would be a place that does not exist there, so
     the island's own default ground height is used instead. It must not be zero:
     see OG_TERRAIN_ELEVATION for what sea level was costing. */
  if (!modeDef(S.mode).live){ S.elevation = mapFor(S.mode).elevation || 0; return; }
  if (!S.transform || !S.pois.length) return;
  const wT = toWorld(S.markers.target);
  let best = null, bd = Infinity;
  for (const p of S.pois){
    const d = Math.hypot(wT.x - p.location.x/100, wT.y - p.location.y/100);
    if (d < bd){ bd = d; best = p; }
  }
  if (best && bd <= CONFIG.snapRadius) S.elevation = best.location.z/100;
}

/* ======================= CALCULATE ======================= */
function buildOpts(){
  /* Everything except the wall offset comes straight from CONFIG. Nothing here
     is user adjustable and nothing here is persisted, so a retuned constant
     takes effect for everyone on the next refresh. */
  return {
    modes:modeSpeeds(S.mode), autoDeployAltitude:CONFIG.autoDeployAltitude,
    minGlideTime:CONFIG.minGlideTime, landingRedeployTime:CONFIG.landingRedeployTime,
    landingRedeployAltitude:CONFIG.landingRedeployAltitude,
    allowEarlyDeploy:CONFIG.allowEarlyDeploy, busSpeed:CONFIG.busSpeed,
    /* Whether the glider can be cut, and any speed this mode measured for
       itself. Battle Royale supplies no overrides, so it gets CONFIG untouched. */
    canCut:modeDef(S.mode).canCut !== false,
    momentumTime:CONFIG.momentumTime, samples:CONFIG.samples,
    busAltitude:CONFIG.busAltitude,
    /* The wall offset is just terrain elevation expressed in a unit players
       can actually judge, so it adds straight on top of the POI elevation. */
    terrainElevation:S.elevation + wallsToMetres(S.wallOffset),
    busStart:toWorld(S.markers.busStart), busEnd:toWorld(S.markers.busEnd),
    target:toWorld(S.markers.target)
  };
}
function calculate(){
  S.result = solveRoute(buildOpts());
  S.stale = false;
  renderResults(); drawOverlay(); save();
}
/* Any input change marks the answer stale. The panel keeps its exact layout
   and just dims, so nothing shifts or collapses; the map overlay drops the
   flight path so no stale answer is shown there. Nothing recalculates. */
function invalidate(){
  if (S.result && !S.stale){
    S.stale = true;
    $('results').classList.add('stale');
  }
}

/* ======================= RESULTS ======================= */
const f1 = (v,n) => (v === undefined || v === null || !isFinite(v)) ? '0.0'
  : v.toFixed(n === undefined ? 1 : n);
const esc = (s) => String(s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderResults(){
  const box = $('results'), r = S.result;
  box.classList.toggle('stale', !!S.stale);
  if (!r){
    box.innerHTML = '<div class="empty">Press Calculate to solve the drop.</div>';
    return;
  }
  if (!r.ok){ box.innerHTML = failureHtml(r); return; }

  let h = '<div class="stat-grid">';
  h += stat('Jump at', 'T+'+f1(r.busTime,1), 's');
  h += stat('Lands at', f1(r.total,1), 's');
  h += stat('Air distance', f1(r.airDistance,0), 'm');
  h += stat('Air time', f1(r.airTime,1), 's');
  h += '</div>';

  h += '<div style="margin-top:16px"><div class="section-label">Descent phases</div>';
  h += '<div class="phase-list">';
  for (const p of r.air.phases){
    const zero = p.time < 0.05;
    h += '<div class="phase'+(zero?' zero':'')+'">'
      +  '<span class="dot" style="background:'+p.color+'"></span>'
      +  '<span class="nm">'+esc(p.label)+'</span>'
      +  '<span class="tm">'+f1(p.time,1)+'s</span></div>';
  }
  h += '</div></div>';

  h += '<div class="note" style="margin-top:12px">'
    +  (r.air.earlyDeploy
        ? 'Too far to dive. Pull the glider <b>straight off the bus</b>, glide '
          + '<b>'+f1(r.air.phases[0].time,1)+'s</b> down to <b>'
          + f1(r.air.diveFromAltitude,0)+' m</b>, then drop back into a dive. '
          + 'It auto-deploys again at <b>100 m</b>'
        : 'Dive it. Glider auto-deploys at <b>100 m</b>')
    /* OG has no cut, so the glider simply carries you in from the auto-deploy
       and there is nothing to hold or re-open. */
    +  (r.air.cut === false
        ? ' and takes you the rest of the way in.'
        : ': hold <b>'+f1(CONFIG.minGlideTime,1)+'s</b>, cut at <b>'
          + f1(r.air.cutAltitude,0)+' m</b>, re-open at <b>~'
          + f1(r.air.reopenAltitude,0)+' m</b> to land.')
    +  '</div>';

  box.innerHTML = h;
}
const stat = (k,v,u) => '<div class="stat"><div class="stat-k">'+k+'</div>'
  + '<div class="stat-v">'+v+'<span class="u">'+u+'</span></div></div>';

function failureHtml(r){
  if (r.reason === 'out-of-range'){
    return '<div class="note err"><b>Out of range.</b> No point on the bus route reaches '
      + 'this spot. Closest approach <b>'+f1(r.closestApproach,0)+' m</b>, short by '
      + '<b>'+f1(r.shortfall,0)+' m</b>.</div>'
      + '<div class="note" style="margin-top:10px">Move the route closer, raise the drop '
      + 'height, or pick a lower landing spot.</div>';
  }
  const msg = {
    'degenerate-route':'Bus start and end are on top of each other. Move them apart.',
    'no-altitude':'The landing spot is at or above the drop height.',
    'no-bus-speed':'Bus speed must be above zero.',
    'momentum-exceeds-altitude':'Bus momentum carry uses the whole drop. Lower it.'
  }[r.reason] || ('Cannot solve: '+r.reason);
  return '<div class="note err">'+msg+'</div>';
}

/* ======================= SAVED DROPS =======================
   A saved drop is the whole setup, not just the landing spot: both bus markers,
   the target and the wall offset. There is NO cap on how many you keep.

   Folders are their own list rather than being inferred from the drops, so an
   empty folder can exist to drag things into. A drop remembers its folder by
   name; load() re-creates any folder a drop names but the folder list has lost,
   so nothing can end up filed somewhere with no row to reach it.
   ========================================================== */

const folderOf = (d) => (d && typeof d.folder === 'string' ? d.folder.trim() : '');

/* A saved drop is a spot on one particular island, so it belongs to the mode it
   was saved in and is only listed there. Anything saved before modes existed is
   Battle Royale, which is what it was. Showing them all together would offer to
   load a Battle Royale pin onto the OG map, where it means nothing. */
const modeOf = (d) => (d && typeof d.mode === 'string' && d.mode) || 'br';
const dropsHere = () => S.drops.map((d,i) => [d,i]).filter(([d]) => modeOf(d) === S.mode);
const CHEV = '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" '
  + 'stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M9 6 L15 12 L9 18"/></svg>';

function renderDrops(){
  const list = $('dropList');
  const here = dropsHere();
  $('dropCount').textContent = String(here.length);

  /* A folder that no longer exists cannot stay highlighted or collapsed. */
  if (S.highlight && !S.folders.includes(S.highlight)) S.highlight = null;
  S.collapsed = S.collapsed.filter(f => S.folders.includes(f));

  if (!here.length && !S.folders.length){
    list.innerHTML = '<div class="drops-empty">Nothing saved yet.</div>';
    return;
  }

  const row = (i) => {
    const d = S.drops[i];
    return '<div class="drop-item" draggable="true" data-drag="'+i+'">'
      + '<span class="grip" aria-hidden="true">'
      + '<svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">'
      + '<circle cx="2.5" cy="3" r="1.2"/><circle cx="7.5" cy="3" r="1.2"/>'
      + '<circle cx="2.5" cy="7" r="1.2"/><circle cx="7.5" cy="7" r="1.2"/>'
      + '<circle cx="2.5" cy="11" r="1.2"/><circle cx="7.5" cy="11" r="1.2"/></svg></span>'
      + '<span class="nm" title="'+esc(d.name)+'">'+esc(d.name)+'</span>'
      + '<button class="btn btn-ghost mini" data-ld="'+i+'">Load</button>'
      + '<button class="drop-x" data-dl="'+i+'" title="Delete" aria-label="Delete '+esc(d.name)+'">'
      + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
      + 'stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
      + '</button></div>';
  };
  const inFolder = (f) => here.filter(([d]) => folderOf(d) === f).map(([,i])=>i);

  let html = '';
  for (const f of S.folders){
    const idxs = inFolder(f), on = S.highlight === f, shut = S.collapsed.includes(f);
    html += '<div class="folder-row'+(on?' on':'')+'" data-zone="'+esc(f)+'">'
      + '<button class="folder-chev'+(shut?' shut':'')+'" data-cl="'+esc(f)+'" '
      + 'aria-expanded="'+(!shut)+'" title="'+(shut?'Expand':'Collapse')+'">'+CHEV+'</button>'
      + '<button class="folder-name" data-fd="'+esc(f)+'" aria-pressed="'+on+'" '
      + 'title="Show this folder\'s area on the map">'
      + '<span class="nm">'+esc(f)+'</span></button>'
      + '<span class="folder-n">'+idxs.length+'</span>'
      + '<button class="drop-x" data-fx="'+esc(f)+'" title="Delete folder" '
      + 'aria-label="Delete folder '+esc(f)+'">'
      + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
      + 'stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
      + '</button></div>';
    if (!shut){
      html += '<div class="folder-kids" data-zone="'+esc(f)+'">'
        + (idxs.length ? idxs.map(row).join('')
                       : '<div class="drops-empty" style="padding:4px 0 6px">Drag drops in here.</div>')
        + '</div>';
    }
  }
  const loose = inFolder('');
  html += '<div class="loose-zone" data-zone="">'
    + (loose.length ? loose.map(row).join('')
       : (S.folders.length ? '<div class="drops-empty" style="padding:4px 0">Drag here to remove from a folder.</div>' : ''))
    + '</div>';
  list.innerHTML = html;

  list.querySelectorAll('[data-ld]').forEach(b => b.onclick = () => loadDrop(+b.dataset.ld));
  list.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => {
    S.drops.splice(+b.dataset.dl, 1); renderDrops(); drawOverlay(); save();
  });
  list.querySelectorAll('[data-fd]').forEach(b => b.onclick = () => {
    S.highlight = (S.highlight === b.dataset.fd) ? null : b.dataset.fd;
    renderDrops(); drawOverlay();
  });
  list.querySelectorAll('[data-cl]').forEach(b => b.onclick = () => {
    const f = b.dataset.cl;
    S.collapsed = S.collapsed.includes(f) ? S.collapsed.filter(x => x !== f)
                                          : S.collapsed.concat(f);
    renderDrops();
  });
  /* Deleting a folder keeps its drops, they just come back out loose. */
  list.querySelectorAll('[data-fx]').forEach(b => b.onclick = () => {
    const f = b.dataset.fx;
    S.folders = S.folders.filter(x => x !== f);
    S.drops.forEach(d => { if (folderOf(d) === f) d.folder = ''; });
    renderDrops(); drawOverlay(); save();
  });

  wireDragDrop(list);
}

/* DRAG A DROP INTO A FOLDER.
   Folder rows, their contents, and the loose area at the bottom are all drop
   zones carrying the folder name in data-zone. Empty string is "no folder". */
function wireDragDrop(list){
  list.querySelectorAll('[data-drag]').forEach(item => {
    item.addEventListener('dragstart', (e) => {
      S.dragging = +item.dataset.drag;
      item.classList.add('dragging');
      try{ e.dataTransfer.setData('text/plain', item.dataset.drag); }catch(err){}
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => {
      S.dragging = null;
      list.querySelectorAll('.dragging,.drag-over')
          .forEach(n => n.classList.remove('dragging','drag-over'));
    });
  });
  list.querySelectorAll('[data-zone]').forEach(zone => {
    zone.addEventListener('dragover', (e) => {
      if (S.dragging === null) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave', (e) => {
      if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
    });
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const i = S.dragging !== null ? S.dragging : parseInt(e.dataTransfer.getData('text/plain'),10);
      S.dragging = null;
      if (!Number.isFinite(i) || !S.drops[i]) return;
      S.drops[i].folder = zone.dataset.zone;
      renderDrops(); drawOverlay(); save();
    });
  });
}

function addFolder(){
  const f = ($('newFolder').value || '').trim();
  if (!f) { $('newFolder').focus(); return; }
  if (!S.folders.some(x => x.toLowerCase() === f.toLowerCase())) S.folders.push(f);
  $('newFolder').value = '';
  renderDrops(); save();
}

function saveDrop(){
  const name = ($('dropName').value || '').trim();
  if (!name){ $('dropName').focus(); return; }
  /* Re-saving the same name overwrites rather than filling a second slot, and
     keeps whichever folder it was already filed under. Scoped to this mode, so
     the same name can name a spot on each island. */
  const existing = S.drops.findIndex(d =>
    d.name.toLowerCase() === name.toLowerCase() && modeOf(d) === S.mode);
  const folder = existing >= 0 ? folderOf(S.drops[existing]) : '';
  const entry = {
    name, folder, mode:S.mode,
    busStart:{...S.markers.busStart}, busEnd:{...S.markers.busEnd},
    target:{...S.markers.target},
    /* Elevation is not stored: it is re-derived from live POI data on load, so
       a saved drop follows the map when the season changes. */
    wallOffset:S.wallOffset
  };
  if (existing >= 0) S.drops[existing] = entry; else S.drops.push(entry);
  $('dropName').value = '';
  renderDrops(); drawOverlay(); save();
}

/* LOADING A DROP DOES NOT TOUCH THE BUS PATH.

   The bus flies a different line every match, so the route is something you set
   from the current game, not something a saved drop should overwrite. A saved
   drop is the landing spot and the wall offset; loading one drops the pin on
   your existing route so you can calculate straight away.

   The bus markers are still written when saving, so the record stays complete
   and old saves keep loading, they are just not applied here. */
function loadDrop(i){
  const d = S.drops[i];
  if (!d) return;
  S.markers.target = {...d.target};
  S.wallOffset = typeof d.wallOffset === 'number' ? d.wallOffset : 0;
  applySnap();                       // elevation follows the current map
  syncWalls();
  /* The target moved, so the old answer no longer describes anything and is
     discarded outright: press Calculate again. */
  S.result = null; S.stale = false;
  renderResults(); drawOverlay(); save();
}

$('btnSaveDrop').addEventListener('click', saveDrop);
$('dropName').addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){ e.preventDefault(); saveDrop(); }
});
$('btnAddFolder').addEventListener('click', addFolder);
$('newFolder').addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){ e.preventDefault(); addFolder(); }
});

/* ======================= WALL HEIGHT OFFSET =======================
   The only control on the page, and the only thing that is persisted besides
   markers and saved drops. Drop height is fixed at CONFIG.busAltitude.
   ================================================================== */
const wallSlider = $('wallSlider');
function syncWalls(){
  const n = clamp(Math.round(S.wallOffset || 0), -CONFIG.wallRange, CONFIG.wallRange);
  S.wallOffset = n;
  wallSlider.value = n;
  wallSlider.style.setProperty('--pct', ((n + CONFIG.wallRange)/(CONFIG.wallRange*2)*100)+'%');
  /* The slider reading is the whole message: '+5 walls' already says which way
     and by how much, so a sentence restating it in metres was noise. */
  $('wallValue').textContent = (n > 0 ? '+' : '') + n + (Math.abs(n) === 1 ? ' wall' : ' walls');
}
wallSlider.addEventListener('input', () => {
  S.wallOffset = parseInt(wallSlider.value, 10) || 0;
  syncWalls(); invalidate(); drawOverlay(); save();
});
$('btnCalc').addEventListener('click', calculate);

/* ======================= MAP IMAGE, SELF UPDATING =======================

   The map ships embedded so the file works offline from file:// on day one.
   On every load it also asks fortnite-api.com for the current blank map and
   swaps it in when that succeeds, so a new season's island appears without
   anyone rebuilding anything. Any failure (offline, DNS, 404, timeout) leaves
   the embedded image in place and the tool carries on.

   Nothing here reads the running game. It is a public metadata endpoint over
   plain HTTPS: no overlay, no screen capture, no memory reading, no game files,
   no traffic inspection, and no auto-detection of the bus route.

   The canvas only ever draws this image, it never reads pixels back, so a
   cross-origin map cannot break rendering even if the CORS headers change. */
function setMapImage(src, onFail){
  const img = new Image();
  img.onload = () => {
    if (!img.naturalWidth || !img.naturalHeight){ if (onFail) onFail(); return; }
    S.img = img; S.imgW = img.naturalWidth; S.imgH = img.naturalHeight;
    S.base = {w:0,h:0};
    try{ makeAmbient(img); }catch(e){ S.ambient = null; }
    layout(); render(); drawOverlay();
  };
  img.onerror = () => { if (onFail) onFail(); };
  img.crossOrigin = 'anonymous';
  img.src = src;
}

/* CACHE BUSTING, AND WHY THE REFRESH NEEDED IT.

   The API serves the island from ONE static URL, /images/map.png, under
   Cache-Control: public, max-age=31536000. A year. The JSON request above asks
   for no-store so the metadata is always fresh, but the image is a plain
   img.src, so a browser that already holds map.png will not ask for it again
   and the refresh silently stops working the first time Epic changes the
   island. It would look like it was working the whole time.

   So the URL has to change when the content might have. Last-Modified cannot
   do that job: it was watched moving from Aug 18 to Aug 20 inside a single
   session while the bytes stayed md5-identical, because it tracks the CDN edge
   and not the asset. Content-Length is honest but needs an extra round trip and
   Vary: accept-encoding makes it wobble. Date.now() would re-download 2.6 MB on
   every single load and throw away the point of embedding a map at all.

   A UTC day bucket costs at most one extra fetch per browser per day and picks
   a new island up within 24 hours of the API publishing it, which is far inside
   the lag of the API itself. The embedded map still paints first, so nothing
   waits on this and a failure still falls back. */
/* THE EMBEDDED ISLAND CAN BE NEWER THAN THE API'S, AND USUALLY IS ON DAY ONE.

   fortnite-api.com mirrors Epic rather than being Epic, and it lags: on the day
   42.00 shipped it was still serving the 41.x island, hours after the season
   went live, with its POI coordinates unchanged too. The embedded map was cut
   from the current island directly, so on that day the live swap would have
   pulled the OLD island back over the NEW one on every single load. The refresh
   would have been actively making the map worse.

   So the live image is only accepted once it stops being the asset we already
   know we have superseded, identified by its exact byte count. A HEAD costs
   nothing, Content-Length is CORS safelisted so it is readable cross-origin,
   and the check clears itself permanently the moment the API publishes anything
   different. When it does, this constant and the check can be deleted outright.

   Any failure keeps the embedded map, which is the safe direction: the embedded
   one is known good and known current, and a missed refresh costs a page load
   rather than an island. */
const SUPERSEDED_MAP_BYTES = 2613644;   // the 41.x island, byte for byte

/* The whole decision, kept pure so it can be tested without a network. An
   unreadable length is treated as superseded: unknown is not a reason to
   overwrite a map cut by hand from the live island. */
const isSupersededMap = (len) =>
  !isFinite(len) || len === SUPERSEDED_MAP_BYTES;

async function liveMapIsNotSuperseded(url){
  try{
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), CONFIG.apiTimeoutMs) : null;
    const res = await fetch(url, Object.assign(
      {method:'HEAD', cache:'no-store'}, ctl ? {signal:ctl.signal} : {}));
    if (timer) clearTimeout(timer);
    if (!res.ok) return false;
    return !isSupersededMap(parseInt(res.headers.get('content-length'), 10));
  }catch(e){ return false; }
}

const dayStamp = () => new Date().toISOString().slice(0, 10);
const bustCache = (url) =>
  url + (url.includes('?') ? '&' : '?') + 'v=' + dayStamp();

/* The live island once the API has answered, so switching OG and back does not
   throw away this season's map and drop to the embedded one. */
let liveMapImage = null;

/* Point the canvas AND the coordinate system at the current mode's island. The
   two always move together: a mode showing one island while measuring against
   another is wrong in a way nothing downstream could detect. */
function applyMapForMode(){
  S.transform = mapFor(S.mode).transform;
  const live = modeDef(S.mode).live && liveMapImage;
  applySnap();
  setMapImage(live || mapFor(S.mode).image,
    () => { if (live) setMapImage(mapFor(S.mode).image, () => {}); });
}

async function loadApi(){
  try{
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), CONFIG.apiTimeoutMs) : null;
    const res = await fetch(CONFIG.apiUrl,
      Object.assign({cache:'no-store'}, ctl ? {signal:ctl.signal} : {}));
    if (timer) clearTimeout(timer);
    if (!res.ok) throw new Error('http '+res.status);
    const d = (await res.json() || {}).data;
    if (!d) throw new Error('bad payload');

    /* POIs give the landing elevation, and they change every season, so they are
       always taken live when available. */
    const pois = (d.pois||[]).filter(p => p && p.location &&
      isFinite(p.location.x) && isFinite(p.location.y) && isFinite(p.location.z));
    /* A shared view is showing an answer that was already worked out, so the
       POIs must not re-snap the elevation or mark it stale. Without this guard
       the shared drop rendered correctly and then blanked a moment later when
       this request came back, which is exactly what it looked like. */
    if (pois.length){
      S.pois = pois;
      if (!S.readonly){ applySnap(); invalidate(); }
    }

    /* The endpoint serves the current Battle Royale island and nothing else, so
       it is remembered either way but only swapped in while a mode that actually
       flies over that island is selected. Coming back from OG picks it up. */
    if (d.images && d.images.blank){
      const url = bustCache(d.images.blank);
      if (await liveMapIsNotSuperseded(url)){
        liveMapImage = url;
        if (modeDef(S.mode).live)
          setMapImage(liveMapImage, () => { liveMapImage = null; });
      }
    }
  }catch(e){ /* offline or the API moved: the embedded map is already up */ }
}

/* ======================= MODE ======================= */
const modeDef = (id) => CONFIG.modes_ui.find(m => m.id === id) || CONFIG.modes_ui[0];

/* The flight speeds a mode actually flies: CONFIG.modes, with that mode's own
   measurements shallow-merged over the top. A mode with no `speeds` gets CONFIG
   byte for byte, which is how Battle Royale stays exactly where it was measured
   no matter what another mode later finds out about the glider. */
const modeSpeeds = (id) => {
  const over = modeDef(id).speeds;
  return over ? Object.assign({}, CONFIG.modes, over) : CONFIG.modes;
};

const TICK = '<svg class="dd-check" viewBox="0 0 24 24" width="13" height="13" '
  + 'aria-hidden="true"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" '
  + 'stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderModes(){
  $('modeBtnText').textContent = modeDef(S.mode).label;
  $('modeList').innerHTML = CONFIG.modes_ui.map(m =>
    '<button class="dd-opt" role="option" data-mode="'+m.id+'"'
    + ' aria-selected="'+(m.id === S.mode)+'"'
    + (m.ready ? '' : ' aria-disabled="true"') + '>'
    + '<span>'+esc(m.label)+'</span>'
    + (m.ready ? TICK : '<span class="dd-tag">soon</span>')
    + '</button>').join('');
  $('modeList').querySelectorAll('[data-mode]').forEach(b => {
    b.onclick = () => {
      if (b.getAttribute('aria-disabled') === 'true') return;
      setMode(b.dataset.mode);
      closeModes(true);
    };
  });
}

/* ---- the popup ---- */
function openModes(){
  const list = $('modeList'), btn = $('modeBtn');
  const r = btn.getBoundingClientRect();
  list.style.left = r.left + 'px';
  list.style.width = r.width + 'px';
  /* Flip above the button when there is not room below it. */
  const below = window.innerHeight - r.bottom;
  list.classList.add('open');
  const h = list.offsetHeight;
  if (below < h + 12 && r.top > h + 12){
    list.style.top = (r.top - h - 6) + 'px';
  } else {
    list.style.top = (r.bottom + 6) + 'px';
  }
  btn.setAttribute('aria-expanded', 'true');
  const cur = list.querySelector('[aria-selected="true"]');
  if (cur) cur.classList.add('active');
}
function closeModes(focusBtn){
  const list = $('modeList');
  list.classList.remove('open');
  list.querySelectorAll('.active').forEach(n => n.classList.remove('active'));
  $('modeBtn').setAttribute('aria-expanded', 'false');
  if (focusBtn) $('modeBtn').focus();
}
const modesOpen = () => $('modeList').classList.contains('open');

$('modeBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  modesOpen() ? closeModes(false) : openModes();
});
/* Anything that would move the button underneath the list just closes it,
   which is simpler and steadier than tracking it. */
document.addEventListener('click', () => { if (modesOpen()) closeModes(false); });
window.addEventListener('resize', () => { if (modesOpen()) closeModes(false); });
document.querySelector('.panel-body')
  .addEventListener('scroll', () => { if (modesOpen()) closeModes(false); }, true);
$('modeList').addEventListener('click', (e) => e.stopPropagation());

$('modeBtn').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){
    e.preventDefault();
    if (!modesOpen()) openModes();
    else moveMode(1);
  }
});
function moveMode(step){
  const opts = [...$('modeList').querySelectorAll('[data-mode]')]
    .filter(o => o.getAttribute('aria-disabled') !== 'true');
  if (!opts.length) return;
  const cur = opts.findIndex(o => o.classList.contains('active'));
  opts.forEach(o => o.classList.remove('active'));
  const next = opts[(cur + step + opts.length) % opts.length] || opts[0];
  next.classList.add('active');
  next.scrollIntoView({block:'nearest'});
}
window.addEventListener('keydown', (e) => {
  if (!modesOpen()) return;
  if (e.key === 'Escape'){ e.preventDefault(); closeModes(true); }
  else if (e.key === 'ArrowDown'){ e.preventDefault(); moveMode(1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); moveMode(-1); }
  else if (e.key === 'Enter'){
    e.preventDefault();
    const a = $('modeList').querySelector('.active');
    if (a){ setMode(a.dataset.mode); closeModes(true); }
  }
});

/* NO EXPLANATORY TEXT IN THE UI. Standing instruction from the user, given more
   than once: the panel states values, never sentences about them. Caveats about
   the model live in these comments and in HANDOFF.md, where whoever is working
   on it will read them, and never on screen where the player has to. The
   provisional flag on a transform is still real and still meaningful, it just
   does not get to talk. */

function setMode(id){
  const m = modeDef(id);
  if (!m.ready) return;                 // greyed rows are not selectable
  if (m.id === S.mode) return;
  S.mode = m.id;
  /* Both the ending and the island change, so any answer worked out under the
     old mode describes nothing now. */
  S.result = null; S.stale = false;
  applyMapForMode();
  renderModes(); renderDrops(); renderResults(); drawOverlay(); save();
}

/* ======================= SHARING =======================

   Two ways to send a drop to someone, both entirely client side so this works
   on a static host with no backend at all.

   IMAGE: renders the map and the overlay into one PNG, framed on the action
   rather than the whole island. Discord embeds a PNG inline, which is why this
   is the one people will actually use.

   LINK: the whole answer is packed into the URL fragment. The fragment never
   leaves the browser (it is not sent to the server), and the read-only page
   contains no solver, so the person you send it to can look but cannot move a
   marker or work out a different drop.

   THE FIVE MINUTE EXPIRY IS COSMETIC, and worth being straight about: the
   payload is in the link, so anyone who edits the timestamp can keep viewing
   it. Making it genuinely expire needs a server to hold the data and hand out
   short ids. Nothing here pretends otherwise.
   ====================================================== */
const SHARE_TTL_MS = 5*60*1000;
const b64u = {
  enc: (s) => btoa(unescape(encodeURIComponent(s)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec: (s) => decodeURIComponent(escape(atob(
    s.replace(/-/g,'+').replace(/_/g,'/'))))
};
const r4 = (v) => Math.round(v*1e4)/1e4;
const r0 = (v) => Math.round(v);

/* Packed as a positional array, not an object, to keep the link short. */
function encodeShare(){
  const r = S.result;
  if (!r || !r.ok) return null;
  const m = S.markers;
  return b64u.enc(JSON.stringify([
    1, Date.now(),
    [r4(m.busStart.x), r4(m.busStart.y)],
    [r4(m.busEnd.x),   r4(m.busEnd.y)],
    [r4(m.target.x),   r4(m.target.y)],
    S.wallOffset,
    [r0(r.jumpPos.x), r0(r.jumpPos.y)],
    [r0(r.exitPos.x), r0(r.exitPos.y)],
    r0(r.airDistance), r4(r.busTime), r4(r.total), r4(r.airTime),
    r.air.earlyDeploy ? 1 : 0,
    r0(r.air.diveFromAltitude || 0), r0(r.air.cutAltitude), r0(r.air.reopenAltitude),
    r.air.phases.map(p => [p.mode, r4(p.time), r0(p.distance), r0(p.altitude)]),
    S.mode
  ]));
}

/* Rebuilds an object the existing draw and render code already understands, so
   the shared view is drawn by exactly the same code as the live one. */
function decodeShare(str){
  try{
    const a = JSON.parse(b64u.dec(str));
    if (!Array.isArray(a) || a[0] !== 1) return null;
    const age = Date.now() - a[1];
    const pt = (p) => ({x:p[0], y:p[1]});
    const modeOf = (m) => (m === 'GLIDE_EARLY' ? CONFIG.modes.GLIDE : CONFIG.modes[m]);
    return {
      age, expired: age > SHARE_TTL_MS,
      mode: (typeof a[17] === 'string' && a[17]) || 'br',
      markers:{busStart:pt(a[2]), busEnd:pt(a[3]), target:pt(a[4])},
      wallOffset: a[5],
      result:{
        ok:true, jumpPos:pt(a[6]), exitPos:pt(a[7]),
        airDistance:a[8], busTime:a[9], total:a[10], airTime:a[11],
        air:{
          earlyDeploy: !!a[12], diveFromAltitude:a[13],
          cut: (a[17] || 'br') === 'br',
          cutAltitude:a[14], reopenAltitude:a[15],
          phases: a[16].map(p => ({
            mode:p[0], label:modeOf(p[0]).label, color:modeOf(p[0]).color,
            time:p[1], distance:p[2], altitude:p[3]
          }))
        }
      }
    };
  }catch(e){ return null; }
}

function shareHint(msg){
  const h = $('shareHint');
  h.textContent = msg; h.style.display = msg ? '' : 'none';
  clearTimeout(shareHint._t);
  if (msg) shareHint._t = setTimeout(() => { h.style.display = 'none'; }, 4000);
}

async function shareLink(){
  const code = encodeShare();
  if (!code){ shareHint('Press Calculate first.'); return; }
  const url = location.origin + location.pathname + '#s=' + code;
  try{
    await navigator.clipboard.writeText(url);
    shareHint('Link copied. It shows the drop read only for 5 minutes.');
  }catch(e){
    /* Clipboard is blocked on file:// in some browsers, so fall back to
       something the user can copy by hand rather than failing silently. */
    prompt('Copy this link:', url);
  }
}

/* ---- IMAGE ----
   Framed on the jump point, the flight and the landing, with padding, so the
   picture shows the part that matters rather than the whole island. */
const IMG_W = 1200, IMG_H = 900, IMG_PAD = 0.75, IMG_MIN_SPAN = 0.10;

function shareFraming(r){
  const pts = [fromWorld(r.jumpPos), fromWorld(r.exitPos), S.markers.target];
  let x0 = Math.min(...pts.map(p=>p.x)), x1 = Math.max(...pts.map(p=>p.x));
  let y0 = Math.min(...pts.map(p=>p.y)), y1 = Math.max(...pts.map(p=>p.y));
  const cx = (x0+x1)/2, cy = (y0+y1)/2;
  let w = Math.max(x1-x0, IMG_MIN_SPAN) * (1+IMG_PAD);
  let h = Math.max(y1-y0, IMG_MIN_SPAN) * (1+IMG_PAD);
  /* Match the output aspect so nothing is squashed. */
  const ar = (IMG_W/IMG_H) * (S.imgH/S.imgW);
  if (w/h < ar) w = h*ar; else h = w/ar;
  return {x0:cx-w/2, y0:cy-h/2, w, h};
}

/* The overlay is drawn by the live code, so the export has to borrow the view
   for one synchronous pass and hand it straight back. */
function overlaySVGFor(fr){
  const keep = {view:{...S.view}, pane:{...S.pane}, base:{...S.base},
                w:svg.getAttribute('width'), h:svg.getAttribute('height'),
                vb:svg.getAttribute('viewBox')};
  S.pane = {w:IMG_W, h:IMG_H};
  S.base = {w:IMG_W/fr.w, h:IMG_H/fr.h};
  S.view = {k:1, x:-fr.x0*S.base.w, y:-fr.y0*S.base.h};
  svg.setAttribute('width', IMG_W); svg.setAttribute('height', IMG_H);
  svg.setAttribute('viewBox', '0 0 '+IMG_W+' '+IMG_H);
  drawOverlay();
  let out = new XMLSerializer().serializeToString(svg);
  /* An SVG rasterised as an image has no stylesheet, so every var() has to be
     resolved to a literal.

     THE SUBSTITUTED VALUE MUST BE XML ESCAPED. This runs after the serializer,
     so anything inserted here is going straight into a double quoted attribute
     without being escaped for us. --font-sans is `"Geist",ui-sans-serif,...`,
     and dropping those raw quotes in produced font-family=""Geist",...", which
     is malformed XML. The image then failed to decode and the export silently
     wrote out a map with no overlay on it, at a perfectly healthy file size. */
  const cs = getComputedStyle(document.documentElement);
  const xml = (v) => v.replace(/&/g,'&amp;').replace(/"/g,'&quot;')
                      .replace(/</g,'&lt;').replace(/>/g,'&gt;');
  out = out.replace(/var\((--[a-z-]+)\)/g,
    (_, v) => xml((cs.getPropertyValue(v) || '#ffffff').trim()));
  S.view = keep.view; S.pane = keep.pane; S.base = keep.base;
  svg.setAttribute('width', keep.w); svg.setAttribute('height', keep.h);
  svg.setAttribute('viewBox', keep.vb);
  drawOverlay();
  return out;
}

async function shareImage(){
  const r = S.result;
  if (!r || !r.ok){ shareHint('Press Calculate first.'); return; }
  if (!S.img){ shareHint('Map still loading.'); return; }
  shareHint('Building image...');
  const fr = shareFraming(r);

  const c = document.createElement('canvas');
  c.width = IMG_W; c.height = IMG_H;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.fillStyle = '#0a0a0a'; g.fillRect(0,0,IMG_W,IMG_H);
  g.drawImage(S.img, fr.x0*S.imgW, fr.y0*S.imgH, fr.w*S.imgW, fr.h*S.imgH,
              0, 0, IMG_W, IMG_H);

  const svgText = overlaySVGFor(fr);      // synchronous, view already restored

  await new Promise((res) => {
    const im = new Image();
    im.onload = () => { g.drawImage(im, 0, 0, IMG_W, IMG_H); res(); };
    im.onerror = res;
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
  });

  const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
  if (!blob){ shareHint('Could not build the image.'); return; }

  /* Clipboard first, so it can go straight into Discord with one paste.
     ClipboardItem needs a secure context, which file:// is not in some browsers,
     so each fallback below is a real possibility rather than dead code. */
  if (navigator.clipboard && window.ClipboardItem){
    try{
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      shareHint('Image copied. Paste it into Discord.');
      return;
    }catch(e){ /* fall through */ }
  }
  const file = new File([blob], 'drop.png', {type:'image/png'});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); shareHint(''); return; }catch(e){}
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'drop.png';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  shareHint('Clipboard blocked here, so the image was saved instead.');
}

/* ---- READ ONLY ---- */
function enterShared(sh){
  S.readonly = true;
  document.body.classList.add('shared');
  S.markers = sh.markers;
  S.wallOffset = sh.wallOffset;
  /* The island travels with the link: a shared OG drop has to open on the OG
     map, or the pin lands somewhere that means nothing. */
  if (sh.mode) { S.mode = sh.mode; applyMapForMode(); renderModes(); }
  S.result = sh.result; S.stale = false;
  $('panel').classList.remove('collapsed');
  syncWalls();
  renderResults();
  /* The countdown lives in the panel subtitle, so the shared view adds no extra
     furniture to the page. */
  const sub = document.querySelector('.panel-sub');
  const tick = () => {
    /* sh.age is how old the link already was when it was opened. */
    const ms = SHARE_TTL_MS - sh.age - (Date.now() - S.sharedAt);
    if (ms <= 0){
      sub.textContent = 'Shared drop, expired';
      S.result = null; renderResults(); drawOverlay();
      clearInterval(S.shareTimer);
      return;
    }
    const s = Math.ceil(ms/1000);
    sub.textContent = 'Shared drop, read only. ' + Math.floor(s/60) + ':'
      + String(s%60).padStart(2,'0') + ' left';
  };
  S.sharedAt = Date.now();
  tick();
  S.shareTimer = setInterval(tick, 1000);
}

$('btnShareImg').addEventListener('click', shareImage);
$('btnShareLink').addEventListener('click', shareLink);

/* ======================= INIT ======================= */
window.addEventListener('resize', () => { layout(); render(); });
if (window.ResizeObserver) new ResizeObserver(() => { layout(); render(); }).observe(stage);

/* A shared link takes over completely: the visitor's own saved drops and
   markers are left untouched in storage, they just are not what is shown. */
const shared = /^#s=/.test(location.hash) ? decodeShare(location.hash.slice(3)) : null;

if (!shared) load();
renderModes();
syncWalls();
renderDrops();
renderResults();
applyMapForMode();                 // stored mode picks its own island
layout(); render();
loadApi();

if (shared){
  if (shared.expired){
    document.body.classList.add('shared');
    document.querySelector('.panel-sub').textContent = 'Shared drop, expired';
  } else {
    enterShared(shared);
  }
  layout(); render(); drawOverlay();
}
</script>
</body>
</html>
